<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Pac-Man Arena 3D — Prima Persona (online)</title>
<style>
  html, body { margin:0; height:100%; background:#050203; overflow:hidden;
    font-family: 'Courier New', monospace; color:#e8e0d8; }
  .hidden { display:none !important; }

  /* ---- schermate overlay (connessione / lobby / fine round) ---- */
  .overlay {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:radial-gradient(ellipse at center, #1a0808 0%, #050203 75%);
  }
  .panel {
    background:#0d0404; border:1px solid #4a1414; border-radius:6px;
    padding:26px 30px; width:340px; box-shadow:0 0 40px #00000090;
  }
  .panel h1 { font-size:16px; letter-spacing:2px; color:#ff8a6e; margin:0 0 18px; text-transform:uppercase; }
  .panel label { display:block; font-size:11px; color:#c8a898; margin:12px 0 4px; }
  .panel input {
    width:100%; box-sizing:border-box; background:#1a0a0a; border:1px solid #4a1414;
    color:#e8e0d8; padding:8px 10px; font-family:inherit; font-size:13px; border-radius:3px;
  }
  .tabs { display:flex; gap:6px; margin-top:6px; }
  .tabs button {
    flex:1; background:#1a0a0a; border:1px solid #4a1414; color:#c8a898;
    padding:7px 0; font-family:inherit; font-size:11px; cursor:pointer; border-radius:3px;
  }
  .tabs button.active { background:#ff5a4d; color:#1a0202; border-color:#ff5a4d; font-weight:bold; }
  .btn-main {
    width:100%; margin-top:18px; padding:10px 0; background:#ff5a4d; color:#1a0202;
    border:none; border-radius:3px; font-family:inherit; font-weight:bold; font-size:13px;
    letter-spacing:1px; cursor:pointer;
  }
  .btn-main:disabled { opacity:0.4; cursor:default; }
  .err { color:#ff6a6a; font-size:11px; margin-top:10px; min-height:14px; }

  #lobbyList { list-style:none; padding:0; margin:14px 0; max-height:180px; overflow:auto; }
  #lobbyList li { padding:6px 8px; font-size:12px; border-bottom:1px solid #2a1010; display:flex; justify-content:space-between; }
  #lobbyList li .tag { color:#ff8a6e; font-size:10px; }

  /* ---- HUD in partita ---- */
  #crosshair {
    position:fixed; top:50%; left:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%; background:#ff5a4d;
    box-shadow:0 0 8px #ff5a4d; pointer-events:none; z-index:5;
  }
  #hud {
    position:fixed; top:12px; left:12px; z-index:5; font-size:12px; text-shadow:0 0 6px #000;
    background:#00000060; padding:8px 12px; border-radius:4px; border:1px solid #4a141460;
  }
  #hud div { margin:2px 0; }
  #hudScore { color:#ffd23f; }
  #hudLives { color:#ff5a5a; }
  #toast {
    position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:6;
    background:#1a0a0acc; border:1px solid #ff5a4d; color:#ffcaa8; padding:8px 16px;
    border-radius:4px; font-size:12px; opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    color:#c8c0b8; font-size:12px; opacity:0.7; text-align:center; text-shadow:0 0 6px #000;
  }
  #deadBanner {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); z-index:8;
    color:#ff4136; font-size:26px; letter-spacing:3px; text-shadow:0 0 12px #000;
  }
</style>
</head>
<body>

<!-- ===================== SCHERMATA CONNESSIONE ===================== -->
<div id="screenConnect" class="overlay">
  <div class="panel">
    <h1>Pac-Man Arena 3D</h1>
    <div class="tabs">
      <button id="tabCreate" class="active">Crea stanza</button>
      <button id="tabJoin">Unisciti</button>
    </div>
    <label>Server</label>
    <input id="inpIp" placeholder="127.0.0.1">
    <label>Porta (vuota se hosted su HTTPS)</label>
    <input id="inpPort" placeholder="8765">
    <label>Nome</label>
    <input id="inpName" placeholder="Player" maxlength="16">
    <div id="joinCodeField" class="hidden">
      <label>Codice stanza</label>
      <input id="inpCode" maxlength="6" style="text-transform:uppercase">
    </div>
    <button id="btnConnect" class="btn-main">Crea stanza</button>
    <div id="connectError" class="err"></div>
  </div>
</div>

<!-- ===================== SCHERMATA LOBBY ===================== -->
<div id="screenLobby" class="overlay hidden">
  <div class="panel">
    <h1>Lobby — <span id="lobbyCode">----</span></h1>
    <ul id="lobbyList"></ul>
    <button id="btnStart" class="btn-main">Avvia partita</button>
    <div id="lobbyHint" style="font-size:11px;color:#c8a898;margin-top:10px;"></div>
  </div>
</div>

<!-- ===================== HUD DI GIOCO ===================== -->
<div id="crosshair" class="hidden"></div>
<div id="hud" class="hidden">
  <div>stanza <b id="hudRoom"></b> — <span id="hudMapName"></span></div>
  <div id="hudScore">punti: 0</div>
  <div id="hudLives">vite: 0</div>
  <div id="hudMissile" class="hidden" style="color:#8fd3ff;"></div>
  <div id="hudMines" class="hidden" style="color:#2bff5c;"></div>
</div>
<div id="toast"></div>
<div id="hint" class="hidden">Click per guardarti intorno — WASD = movimento relativo allo sguardo — tasto destro = spara laser (se sbloccato)</div>
<div id="deadBanner" class="hidden">SEI MORTO — attendi il respawn</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   COSTANTI CONDIVISE COL SERVER (common.py) — solo quelle che
   servono al client per interpretare i messaggi.
   ============================================================ */
const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEY_TO_DIR = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};
const COLOR_HEX = {
  azzurro:"#29d6ff", giallo:"#ffd400", verde:"#33ff77", bianco:"#f5f5f5", rosa:"#ff5fd1",
  arancione:"#ff9d1f", rosso:"#ff4136", viola:"#9b3bff", lime:"#c6ff3f", oro:"#ffcf40",
  ciano:"#22e6ff", magenta:"#ff2b9e", grigio:"#c7d0d8", marrone:"#b5651d",
  blu_notte:"#5b6bff", corallo:"#ff5a36", nero:"#000000",
};
const CELL = 2;       // dimensione di una cella nel mondo 3D
const WALL_H = 3.2;
const EYE_HEIGHT = 1.15;

/* ============================================================
   MURI A CUBETTI IMPILATI: invece di un unico box CELLxWALL_Hx
   CELL (proporzioni non cubiche), ogni muro e' una PILA di cubi
   perfetti (lato = CELL), impilati fino a coprire WALL_H. Il
   numero di cubetti e' scelto in modo che l'altezza totale
   resti il piu' vicina possibile a WALL_H (arrotondato per
   eccesso, cosi' i muri restano almeno alti quanto prima).
   ============================================================ */
const WALL_CUBES_PER_COLUMN = Math.max(1, Math.round(WALL_H / CELL));
const WALL_CUBE_SIZE = CELL; // lato del cubetto = dimensione cella (proporzione 1:1:1)
const WALL_TOTAL_H = WALL_CUBES_PER_COLUMN * WALL_CUBE_SIZE;

/* ============================================================
   PALETTE A CHIAZZE DETERMINISTICHE (portata identica da
   index.html / drawMaze 2D): ogni muro non ha un colore fisso,
   ma viene assegnato - a "chiazze" di 2-4 celle, sempre le
   stesse per la stessa mappa - a una delle 4 varianti della
   palette del tema. Qui il risultato serve a colorare sia le
   celle in pianta (x,y) SIA, con una variante indipendente per
   ogni "piano" della pila di cubetti, cosi' il mosaico si vede
   anche in verticale.
   ============================================================ */
function lightenHex(hex, amt){
  const p = (hex||"#333333").replace("#","");
  if (p.length !== 6) return hex;
  const ch = i => {
    const v = parseInt(p.slice(i,i+2),16);
    return Math.max(0, Math.min(255, Math.round(v + 255*amt)));
  };
  return "rgb(" + ch(0) + "," + ch(2) + "," + ch(4) + ")";
}
function mixHex(a, b, t){
  const pa = (a||"#333333").replace("#",""), pb = (b||"#000000").replace("#","");
  if (pa.length !== 6 || pb.length !== 6) return a;
  const ch = i => {
    const va = parseInt(pa.slice(i,i+2),16), vb = parseInt(pb.slice(i,i+2),16);
    return Math.round(va + (vb-va)*t);
  };
  return "rgb(" + ch(0) + "," + ch(2) + "," + ch(4) + ")";
}
function makeThemeVariants(theme){
  if (Array.isArray(theme.palette) && theme.palette.length){
    return theme.palette.map(p => ({ wall:p.wall, edge:p.edge, glow:p.glow }));
  }
  const base = { wall:theme.wall, edge:theme.edge, glow:theme.glow };
  return [
    base,
    { wall: lightenHex(theme.wall,0.10), edge: lightenHex(theme.edge,0.14), glow: lightenHex(theme.glow,0.12) },
    { wall: lightenHex(theme.wall,0.20), edge: theme.glow, glow: lightenHex(theme.glow,0.25) },
    { wall: mixHex(theme.wall, theme.bg||"#000000", 0.35), edge: lightenHex(theme.edge,0.05), glow: theme.glow },
  ];
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const WALL_PATCH_MIN_SIZE = 2;
const WALL_PATCH_MAX_SIZE = 4;
let themeWallVariants = [];
let wallColorByCell = {};      // "x,y" -> indice variante (pianta, identico al 2D)
let wallColorByCube  = {};     // "x,y,level" -> indice variante (per-cubetto in verticale)

// Chiazze deterministiche in PIANTA: stesso identico algoritmo di
// computeWallColors in index.html (stesso seed "wallcolors:"+nomeMappa
// => stessa disposizione a mosaico su qualunque client/versione).
function computeWallColorsFlat(){
  wallColorByCell = {};
  const nVariants = themeWallVariants.length;
  const rng = mulberry32(hashSeed("wallcolors:" + (mazeTheme.__mapName || "default")));
  const visited = new Set();
  let lastIdx = -1;
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      const key = x+","+y;
      if (!isWall(x,y) || visited.has(key)) continue;
      let idx;
      do { idx = Math.floor(rng()*nVariants); } while (nVariants>1 && idx===lastIdx);
      lastIdx = idx;
      const targetSize = WALL_PATCH_MIN_SIZE + Math.floor(rng()*(WALL_PATCH_MAX_SIZE-WALL_PATCH_MIN_SIZE+1));
      const frontier = [[x,y]];
      visited.add(key);
      wallColorByCell[key] = idx;
      let count = 1;
      while (frontier.length && count < targetSize){
        const pick = Math.floor(rng()*frontier.length);
        const [cx,cy] = frontier.splice(pick,1)[0];
        const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
        for (const [nx,ny] of neighbors){
          if (count >= targetSize) break;
          if (nx<0||ny<0||nx>=mazeW||ny>=mazeH) continue;
          const nkey = nx+","+ny;
          if (visited.has(nkey) || !isWall(nx,ny)) continue;
          visited.add(nkey);
          wallColorByCell[nkey] = idx;
          frontier.push([nx,ny]);
          count++;
        }
      }
    }
  }
}

// Chiazze deterministiche PER LIVELLO (una "colonna" (x,y) attraversa
// WALL_CUBES_PER_COLUMN cubetti impilati): stessa idea, ma la crescita
// delle chiazze avviene nello spazio 3D (x,y,level) invece che solo
// (x,y), cosi' il mosaico e' visibile anche guardando un muro dal
// basso verso l'alto, non solo "a volo d'uccello". Seed diverso da
// quello in pianta (suffisso ":cubes") ma comunque deterministico sul
// nome mappa: stessa mappa => stessa disposizione, sempre.
function computeWallColorsCubes(){
  wallColorByCube = {};
  const nVariants = themeWallVariants.length;
  const rng = mulberry32(hashSeed("wallcolors:cubes:" + (mazeTheme.__mapName || "default")));
  const visited = new Set();
  let lastIdx = -1;
  const L = WALL_CUBES_PER_COLUMN;
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (!isWall(x,y)) continue;
      for (let lvl=0; lvl<L; lvl++){
        const key = x+","+y+","+lvl;
        if (visited.has(key)) continue;
        let idx;
        do { idx = Math.floor(rng()*nVariants); } while (nVariants>1 && idx===lastIdx);
        lastIdx = idx;
        const targetSize = WALL_PATCH_MIN_SIZE + Math.floor(rng()*(WALL_PATCH_MAX_SIZE-WALL_PATCH_MIN_SIZE+1));
        const frontier = [[x,y,lvl]];
        visited.add(key);
        wallColorByCube[key] = idx;
        let count = 1;
        while (frontier.length && count < targetSize){
          const pick = Math.floor(rng()*frontier.length);
          const [cx,cy,cl] = frontier.splice(pick,1)[0];
          const neighbors = [[cx+1,cy,cl],[cx-1,cy,cl],[cx,cy+1,cl],[cx,cy-1,cl],[cx,cy,cl+1],[cx,cy,cl-1]];
          for (const [nx,ny,nl] of neighbors){
            if (count >= targetSize) break;
            if (nx<0||ny<0||nx>=mazeW||ny>=mazeH||nl<0||nl>=L) continue;
            if (!isWall(nx,ny)) continue;
            const nkey = nx+","+ny+","+nl;
            if (visited.has(nkey)) continue;
            visited.add(nkey);
            wallColorByCube[nkey] = idx;
            frontier.push([nx,ny,nl]);
            count++;
          }
        }
      }
    }
  }
}

/* ============================================================
   STATO DI CONNESSIONE (stesso identico protocollo di index.html:
   create_room/join_room -> room_created/joined -> select_color/
   select_character -> start_game -> round_start -> state/event)
   ============================================================ */
let ws = null;
let myId = null, roomCode = null, myName = "Player", iAmHost = false;
let joinMode = false;

/* ---- precompila il campo "Server" con l'indirizzo da cui la pagina e'
   stata caricata (location.hostname), cosi' su Render/qualsiasi hosting
   il campo e' gia' corretto senza doverlo scrivere a mano. Se la pagina
   e' aperta come file locale (file://, hostname vuoto) resta il
   placeholder 127.0.0.1. La porta resta vuota di proposito: su hosting
   HTTPS (Render ecc.) il traffico passa su 443/WSS, non su una porta
   custom come 8765 (quella serve solo per il server avviato in locale). ---- */
window.addEventListener("DOMContentLoaded", () => {
  if (location.hostname) {
    document.getElementById("inpIp").value = location.hostname;
  }
});

let maze = [], mazeW = 0, mazeH = 0, mazeTheme = null;

function sendMsg(obj){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function connect(ip, port, onOpen){
  const secure = location.protocol === "https:";
  const scheme = secure ? "wss://" : "ws://";
  const effectivePort = port || (secure ? "" : "8765");
  const portPart = effectivePort ? (":" + effectivePort) : "";
  const url = scheme + ip + portPart + "/";
  const errEl = document.getElementById("connectError");
  errEl.textContent = "Connessione a " + url + " in corso\u2026";
  // Se la pagina e' su HTTPS (es. anteprima artifact) e si prova un
  // ws:// non cifrato verso un indirizzo locale, il browser blocca la
  // connessione per policy "mixed content" - spesso SENZA lanciare
  // alcun errore visibile: onopen/onerror non scattano mai e il
  // pulsante sembra "non fare niente". Questo timeout rende visibile
  // anche quel caso.
  const openTimeout = setTimeout(() => {
    if (ws && ws.readyState !== WebSocket.OPEN){
      errEl.textContent = secure
        ? "Nessuna risposta da " + url + ". Se il server e' locale (127.0.0.1) e questa pagina e' aperta dentro l'anteprima HTTPS di Claude, il browser blocca la connessione ws:// non cifrata (\"mixed content\"): scarica questo file e aprilo direttamente nel browser (doppio click, o servilo in locale), non dentro l'anteprima."
        : "Nessuna risposta da " + url + ". Controlla che il server sia avviato e l'indirizzo/porta siano giusti.";
    }
  }, 3500);
  try { ws = new WebSocket(url); }
  catch(e){ clearTimeout(openTimeout); errEl.textContent = "Indirizzo non valido: " + e.message; return; }
  ws.onopen = () => { clearTimeout(openTimeout); errEl.textContent = ""; onOpen(); };
  ws.onmessage = ev => handleMessage(JSON.parse(ev.data));
  ws.onerror = () => { clearTimeout(openTimeout); errEl.textContent = "Errore di connessione al server (" + url + ")."; };
  ws.onclose = () => { clearTimeout(openTimeout); if (currentScreen !== "connect") errEl.textContent = "Connessione persa."; };
}

/* ---- UI: tab crea/unisciti ---- */
document.getElementById("tabCreate").addEventListener("click", () => {
  joinMode = false;
  document.getElementById("tabCreate").classList.add("active");
  document.getElementById("tabJoin").classList.remove("active");
  document.getElementById("joinCodeField").classList.add("hidden");
  document.getElementById("btnConnect").textContent = "Crea stanza";
});
document.getElementById("tabJoin").addEventListener("click", () => {
  joinMode = true;
  document.getElementById("tabJoin").classList.add("active");
  document.getElementById("tabCreate").classList.remove("active");
  document.getElementById("joinCodeField").classList.remove("hidden");
  document.getElementById("btnConnect").textContent = "Unisciti alla stanza";
});
document.getElementById("btnConnect").addEventListener("click", () => {
  const errEl = document.getElementById("connectError");
  errEl.textContent = "";
  const ip = (document.getElementById("inpIp").value || "127.0.0.1").trim();
  const port = document.getElementById("inpPort").value.trim();
  myName = (document.getElementById("inpName").value || "Player").trim().slice(0,16) || "Player";
  if (joinMode && !document.getElementById("inpCode").value.trim()){
    errEl.textContent = "Inserisci il codice della stanza."; return;
  }
  connect(ip, port, () => {
    if (joinMode){
      const code = document.getElementById("inpCode").value.trim().toUpperCase();
      sendMsg({ type:"join_room", code, name: myName });
    } else {
      sendMsg({ type:"create_room", name: myName });
    }
  });
});

/* ============================================================
   GESTIONE MESSAGGI (stessi "type"/"kind" di index.html)
   ============================================================ */
let currentScreen = "connect";
function showScreen(name){
  currentScreen = name;
  document.getElementById("screenConnect").classList.toggle("hidden", name !== "connect");
  document.getElementById("screenLobby").classList.toggle("hidden", name !== "lobby");
  document.getElementById("crosshair").classList.toggle("hidden", name !== "game");
  document.getElementById("hud").classList.toggle("hidden", name !== "game");
  document.getElementById("hint").classList.toggle("hidden", name !== "game");
}

function handleMessage(msg){
  switch (msg.type){
    case "room_created": case "joined": case "rejoined":
      myId = msg.player_id; roomCode = msg.code;
      applyMapData(msg);
      document.getElementById("hudRoom").textContent = roomCode;
      document.getElementById("lobbyCode").textContent = roomCode;
      // Auto-selezione colore/personaggio: il prototipo salta la UI di
      // scelta colore/personaggio di index.html, ne sceglie uno libero
      // in automatico cosi' si puo' entrare in game piu' in fretta.
      sendMsg({ type:"select_color", colors:[myAutoColor()] });
      sendMsg({ type:"select_character", character:"classic" });
      showScreen("lobby");
      break;
    case "error":
      document.getElementById("connectError").textContent = msg.message;
      document.getElementById("lobbyHint").textContent = msg.message;
      break;
    case "lobby_state":
      onLobbyState(msg);
      break;
    case "round_start":
      applyMapData(msg);
      enterGame();
      break;
    case "state":
      onState(msg);
      break;
    case "event":
      onGameEvent(msg);
      break;
    case "round_end":
      onRoundEnd(msg);
      break;
    case "rtt_ping":
      sendMsg({ type:"rtt_pong", t: msg.t });
      break;
  }
}

let lobbyPlayersCache = [];
function myAutoColor(){
  const taken = new Set(lobbyPlayersCache.map(p => (p.colors||[])[0]).filter(Boolean));
  const pool = ["giallo","azzurro","verde","rosa","arancione","viola","lime","corallo"];
  return pool.find(c => !taken.has(c)) || "bianco";
}

function onLobbyState(msg){
  lobbyPlayersCache = msg.players;
  const me = msg.players.find(p => p.id === myId);
  iAmHost = !!(me && me.host);
  const list = document.getElementById("lobbyList");
  list.innerHTML = "";
  msg.players.forEach(p => {
    const li = document.createElement("li");
    const hex = COLOR_HEX[(p.colors||[])[0]] || "#888";
    li.innerHTML = '<span style="color:'+hex+'">\u25CF ' + p.name + '</span>' +
      '<span class="tag">' + (p.host ? "HOST" : "") + '</span>';
    list.appendChild(li);
  });
  document.getElementById("btnStart").style.display = iAmHost ? "block" : "none";
  document.getElementById("lobbyHint").textContent = iAmHost
    ? "Sei l'host: premi Avvia quando siete pronti."
    : "In attesa che l'host avvii la partita\u2026";
}
document.getElementById("btnStart").addEventListener("click", () => sendMsg({ type:"start_game" }));

function onRoundEnd(msg){
  exitGame();
  const rows = Object.keys(msg.scores||{}).map(id => ({
    id, name:(msg.names&&msg.names[id])||id, pts: msg.scores[id]
  })).sort((a,b)=>b.pts-a.pts);
  document.getElementById("lobbyHint").textContent = "Round finito. Classifica: " +
    rows.map((r,i)=> (i+1)+". "+r.name+" ("+r.pts+"pt)").join(" \u00b7 ");
  showScreen("lobby");
}

/* ============================================================
   MAPPA -> SCENA 3D
   ============================================================ */
function isWall(cx, cy){
  if (cx < 0 || cy < 0 || cx >= mazeW || cy >= mazeH) return true;
  return maze[cy][cx] === "#";
}
function hexToInt(h){ return parseInt((h||"#333333").replace("#",""), 16); }

let scene, camera, renderer, torch;
let wallMeshGroup = null;
let floorMeshGroup = null;
let pelletMeshes = {};   // "x,y" -> THREE.Mesh
let powerPelletCells = new Set();
let remotePlayers = {};  // id -> {group, targetX, targetZ, colorHex}
let laserMeshes = {};    // id -> {mesh, x, z, targetX, targetZ} bonus 150 punti: proiettili laser in volo
let missileMeshes = {};  // id -> {mesh, x, z, targetX, targetZ} bonus 400 punti: missile guidato in volo
let mineMeshes = {};     // id -> mesh bonus 200 punti: mine posate, statiche (nessuna interpolazione)
let playerColorHex = {}; // playerId -> colore primario (int), aggiornato da onState/onLobbyState:
                          // serve a colorare oggetti "di proprieta'" di un giocatore (missile, ecc.)
                          // per riconoscerne subito il lanciatore, come nella versione 2D.
let explosions = [];     // { mesh, start } - piccola sfera che si espande e sfuma, riusata da
                          // qualsiasi evento "botto" (missile_end, missile_reflect, e in futuro
                          // mine_boom/superbomb/ecc.) invece di scrivere un effetto ad hoc ognuno.
function spawnExplosion(wx, wz, colorHex){
  const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent:true, opacity:0.9 });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), mat);
  mesh.position.set(wx, 0.55, wz);
  scene.add(mesh);
  explosions.push({ mesh, start: performance.now() });
}

function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.05, 100);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x402020, 0.55));
  torch = new THREE.PointLight(0xffffff, 1.4, 9, 2);
  scene.add(torch);
  scene.add(new THREE.HemisphereLight(0x553030, 0x0a0202, 0.4));
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function applyMapData(msg){
  maze = msg.maze; mazeW = msg.maze_w; mazeH = msg.maze_h;
  mazeTheme = msg.theme || {};
  powerPelletCells = new Set((msg.power_pellets||[]).map(c => c[0]+","+c[1]));
  document.getElementById("hudMapName").textContent = msg.maze_name || "";

  if (!scene) initThree();

  // ripulisce la scena (muri/pallini della mappa precedente, se ce n'era una)
  if (wallMeshGroup) scene.remove(wallMeshGroup);
  Object.values(pelletMeshes).forEach(m => scene.remove(m));
  pelletMeshes = {};

  const bgColor    = hexToInt(mazeTheme.bg    || "#0d0202");
  const pelletColor= hexToInt(mazeTheme.pellet|| "#ffb35c");
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.Fog(bgColor, 6, 34);
  torch.color = new THREE.Color(hexToInt(mazeTheme.glow || "#ff5a4d"));

  // pavimento: una cella per ogni casella percorribile della mappa (non
  // un unico piano uniforme), a scacchiera con due tonalità derivate dal
  // colore di sfondo del tema, cosi' la griglia di gioco si legge anche
  // guardando in basso e il pavimento non sembra un piano vuoto e piatto.
  if (floorMeshGroup) scene.remove(floorMeshGroup);
  const floorColorA = bgColor;
  const floorColorB = hexToInt(lightenHex(mazeTheme.bg || "#0d0202", 0.05));
  const floorGeo = new THREE.PlaneGeometry(CELL, CELL);
  const floorMatA = new THREE.MeshStandardMaterial({ color:floorColorA, roughness:1 });
  const floorMatB = new THREE.MeshStandardMaterial({ color:floorColorB, roughness:1 });
  let countA = 0, countB = 0;
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (isWall(x,y)) continue;
      if ((x+y) % 2 === 0) countA++; else countB++;
    }
  }
  const floorInstA = countA > 0 ? new THREE.InstancedMesh(floorGeo, floorMatA, countA) : null;
  const floorInstB = countB > 0 ? new THREE.InstancedMesh(floorGeo, floorMatB, countB) : null;
  const floorDummy = new THREE.Object3D();
  floorDummy.rotation.x = -Math.PI/2;
  let wA = 0, wB = 0;
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (isWall(x,y)) continue;
      floorDummy.position.set(x*CELL+CELL/2, 0, y*CELL+CELL/2);
      floorDummy.updateMatrix();
      if ((x+y) % 2 === 0){ floorInstA.setMatrixAt(wA++, floorDummy.matrix); }
      else { floorInstB.setMatrixAt(wB++, floorDummy.matrix); }
    }
  }
  floorMeshGroup = new THREE.Group();
  floorMeshGroup.name = "__floor";
  if (floorInstA) floorMeshGroup.add(floorInstA);
  if (floorInstB) floorMeshGroup.add(floorInstB);
  // base piena sotto ai muri (evita buchi/fondo nero nelle celle non
  // percorribili quando la telecamera guarda tra i cubetti dei muri)
  const floorBase = new THREE.Mesh(
    new THREE.PlaneGeometry(mazeW*CELL, mazeH*CELL),
    new THREE.MeshStandardMaterial({ color:floorColorA, roughness:1 })
  );
  floorBase.rotation.x = -Math.PI/2;
  floorBase.position.set(mazeW*CELL/2, -0.01, mazeH*CELL/2);
  floorMeshGroup.add(floorBase);
  scene.add(floorMeshGroup);

  // muri: pila di CUBETTI (lato = CELL, proporzioni 1:1:1) invece di un
  // unico parallelepipedo, colorati "a chiazze" con le 4 varianti della
  // palette del tema, esattamente come fa drawMaze nel client 2D. Serve
  // una InstancedMesh PER VARIANTE (materiale diverso per variante), non
  // una sola: ogni variante colora un sottoinsieme di cubetti.
  mazeTheme.__mapName = msg.maze_name || mazeTheme.__mapName || "default";
  themeWallVariants = makeThemeVariants(mazeTheme);
  computeWallColorsFlat();
  computeWallColorsCubes();

  const cubeGeo = new THREE.BoxGeometry(WALL_CUBE_SIZE, WALL_CUBE_SIZE, WALL_CUBE_SIZE);
  const nVariants = themeWallVariants.length;

  // conta quanti cubetti servono per variante
  const countPerVariant = new Array(nVariants).fill(0);
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (!isWall(x,y)) continue;
      for (let lvl=0; lvl<WALL_CUBES_PER_COLUMN; lvl++){
        const idx = wallColorByCube[x+","+y+","+lvl] ?? wallColorByCell[x+","+y] ?? 0;
        countPerVariant[idx]++;
      }
    }
  }

  const dummy = new THREE.Object3D();
  const wallMeshesPerVariant = [];
  const writeIdx = new Array(nVariants).fill(0);
  for (let v=0; v<nVariants; v++){
    const variant = themeWallVariants[v];
    const mat = new THREE.MeshStandardMaterial({
      color: hexToInt(variant.wall),
      emissive: hexToInt(variant.edge),
      emissiveIntensity: 0.15,
      roughness: 0.85,
    });
    const inst = countPerVariant[v] > 0
      ? new THREE.InstancedMesh(cubeGeo, mat, countPerVariant[v])
      : null;
    wallMeshesPerVariant.push(inst);
  }

  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (!isWall(x,y)) continue;
      for (let lvl=0; lvl<WALL_CUBES_PER_COLUMN; lvl++){
        const idx = wallColorByCube[x+","+y+","+lvl] ?? wallColorByCell[x+","+y] ?? 0;
        const inst = wallMeshesPerVariant[idx];
        if (!inst) continue;
        dummy.position.set(
          x*CELL + CELL/2,
          lvl*WALL_CUBE_SIZE + WALL_CUBE_SIZE/2,
          y*CELL + CELL/2
        );
        dummy.updateMatrix();
        inst.setMatrixAt(writeIdx[idx]++, dummy.matrix);
      }
    }
  }

  wallMeshGroup = new THREE.Group();
  wallMeshesPerVariant.forEach(inst => { if (inst) wallMeshGroup.add(inst); });
  scene.add(wallMeshGroup);

  // pallini: quelli "ancora presenti" secondo il server (msg.pellets)
  const remaining = new Set((msg.pellets||[]).map(c => c[0]+","+c[1]));
  const normalGeo = new THREE.SphereGeometry(0.09, 8, 6);
  const powerGeo = new THREE.SphereGeometry(0.22, 10, 8);
  const pelletMat = new THREE.MeshStandardMaterial({ color:pelletColor, emissive:pelletColor, emissiveIntensity:0.6 });
  remaining.forEach(key => {
    const [x,y] = key.split(",").map(Number);
    const isPower = powerPelletCells.has(key);
    const mesh = new THREE.Mesh(isPower ? powerGeo : normalGeo, pelletMat);
    mesh.position.set(x*CELL+CELL/2, isPower ? 0.5 : 0.35, y*CELL+CELL/2);
    scene.add(mesh);
    pelletMeshes[key] = mesh;
  });
}

/* ---- costruisce un personaggio semplice (cilindro+sfere: niente
   CapsuleGeometry, non esiste nella versione r128 di three.js usata qui) ---- */
function makeCharacterMesh(colorHex){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:colorHex, emissive:colorHex, emissiveIntensity:0.12 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.5,12), mat);
  cyl.position.y = 0.56; g.add(cyl);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,8), mat);
  top.position.y = 0.81; g.add(top);
  const bot = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,8), mat);
  bot.position.y = 0.31; g.add(bot);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.11,0.3,8),
    new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x222222 }));
  nose.rotation.x = Math.PI/2;
  nose.position.set(0, 0.6, 0.4);
  g.add(nose);
  return g;
}

/* ---- bonus 400 punti: missile guidato — stessa idea della versione 2D
   (drawMissiles: alone translucido nel colore del proprietario + nucleo
   bianco acceso al centro), qui come due sfere in un gruppo. ---- */
function makeMissileMesh(colorHex){
  const g = new THREE.Group();
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 10, 8),
    new THREE.MeshBasicMaterial({ color: colorHex, transparent:true, opacity:0.35 })
  );
  g.add(halo);
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 6),
    new THREE.MeshStandardMaterial({ color:0xe8f7ff, emissive:0xe8f7ff, emissiveIntensity:1.3 })
  );
  g.add(core);
  return g;
}

/* ---- bonus 200 punti: mina — stessa idea della versione 2D (drawMines:
   quadrato pieno bordato di scuro con nucleo bianco pulsante), qui come
   un piccolo cilindro basso nel colore del proprietario con un nucleo
   che pulsa lentamente per restare visibile anche da lontano. A
   differenza del missile la mina resta ferma: nessuna interpolazione,
   basta posizionarla una volta e lasciarla li'. ---- */
function makeMineMesh(colorHex){
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.2, 0.12, 10),
    new THREE.MeshStandardMaterial({ color: colorHex })
  );
  base.position.y = 0.06;
  g.add(base);
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 8, 6),
    new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:1.1 })
  );
  core.position.y = 0.16;
  g.add(core);
  g.userData.core = core; // per farlo pulsare nel render loop
  return g;
}

/* ============================================================
   MOVIMENTO: WASD relativo allo sguardo (yaw della camera), non piu'
   fisso rispetto alla mappa. "W" e' sempre "avanti rispetto a dove sto
   guardando", "A"/"D" sempre sinistra/destra rispetto allo sguardo,
   "S" sempre indietro. Siccome pero' il server accetta solo le 4
   direzioni di griglia (up/down/left/right), lo sguardo viene
   "agganciato" (snap) alla direzione cardinale piu' vicina: es. se sto
   guardando qualcosa tra nord e ovest ma piu' verso nord, "W" manda
   "up". La direzione va ricalcolata ad ogni movimento del mouse (non
   solo alla pressione del tasto): se tengo premuto "W" e giro la
   visuale oltre i 45 gradi, il verso inviato al server deve cambiare
   di conseguenza senza dover rilasciare e ripremere il tasto.
   ============================================================ */
let lastRequestedDir = null;
function requestDir(dir){
  if (dir !== lastRequestedDir) lastRequestedDir = dir;
  sendMsg({ type:"move", direction:dir });
}

// Tasto fisico -> "verso" astratto relativo alla camera (non ancora una
// direzione di griglia: quella si calcola in base allo yaw corrente).
function normalizeMoveKey(key){
  const map = {
    w:"forward", W:"forward", ArrowUp:"forward",
    s:"backward", S:"backward", ArrowDown:"backward",
    a:"left", A:"left", ArrowLeft:"left",
    d:"right", D:"right", ArrowRight:"right",
  };
  return map[key] || null;
}

// Data una coppia (x,z) nel piano orizzontale, restituisce la direzione
// di griglia il cui asse e' piu' allineato (snap ai 4 cardinali).
// Convenzione del progetto: up=[0,-1] (z decresce), down=[0,1] (z
// cresce), left=[-1,0] (x decresce), right=[1,0] (x cresce) — vedi
// DIR_VEC e applyMapData (wx = x*CELL, wz = y*CELL).
function dirFromVector(x, z){
  return Math.abs(x) > Math.abs(z) ? (x > 0 ? "right" : "left")
                                    : (z > 0 ? "down" : "up");
}

// "Verso" astratto (forward/backward/left/right rispetto alla camera) ->
// direzione di griglia effettiva, in base allo yaw corrente.
function baseToGridDir(base){
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw); // avanti rispetto alla camera
  const rx =  Math.cos(yaw), rz = -Math.sin(yaw); // destra rispetto alla camera
  switch (base){
    case "forward":  return dirFromVector(fx, fz);
    case "backward": return dirFromVector(-fx, -fz);
    case "right":    return dirFromVector(rx, rz);
    case "left":     return dirFromVector(-rx, -rz);
    default: return null;
  }
}

const heldMoveKeys = new Set(); // "forward"/"backward"/"left"/"right" attualmente premuti
let heldBase = null;            // ultimo tasto premuto, ha la priorita'

function updateMovementDirection(){
  if (!heldBase) return;
  const dir = baseToGridDir(heldBase);
  if (dir) requestDir(dir);
}

window.addEventListener("keydown", e => {
  if (currentScreen !== "game") return;
  const base = normalizeMoveKey(e.key);
  if (!base || heldMoveKeys.has(base)) return; // ignora la ripetizione automatica del tasto tenuto premuto
  heldMoveKeys.add(base);
  heldBase = base;
  updateMovementDirection();
});
window.addEventListener("keyup", e => {
  const base = normalizeMoveKey(e.key);
  if (!base) return;
  heldMoveKeys.delete(base);
  if (heldBase === base){
    // se restano altri tasti di movimento premuti, passa a uno di quelli
    heldBase = heldMoveKeys.size ? heldMoveKeys.values().next().value : null;
    if (heldBase) updateMovementDirection();
  }
});

let yaw = 0, pitch = 0, locked = false;
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement && document.pointerLockElement.tagName === "CANVAS";
});
document.addEventListener("mousemove", e => {
  if (!locked) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, pitch));
  updateMovementDirection(); // lo sguardo e' cambiato: se un tasto e' tenuto premuto, ricalcola il verso
});

/* ============================================================
   LASER (bonus 150 punti): a differenza della versione 2D non
   spara piu' in automatico quando un nemico e' vicino. E' il
   giocatore a decidere quando sparare, con il tasto destro del
   mouse, mirando con il punto rosso (crosshair) gia' al centro
   dello schermo. La direzione inviata al server e' quella di
   griglia piu' allineata allo sguardo attuale (stesso snap ai 4
   cardinali gia' usato per il movimento, vedi dirFromVector):
   il server accetta solo le 4 direzioni di griglia, non un
   angolo libero.
   ============================================================ */
document.addEventListener("contextmenu", e => {
  if (currentScreen === "game") e.preventDefault(); // niente menu del browser durante il gioco
});
document.addEventListener("mousedown", e => {
  if (currentScreen !== "game" || !locked) return;
  if (e.button !== 2) return; // solo tasto destro
  e.preventDefault();
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw); // direzione in cui sto guardando (piano orizzontale)
  const dir = dirFromVector(fx, fz);
  sendMsg({ type:"fire_laser", direction: dir });
});

/* ============================================================
   MISSILE GUIDATO (bonus 400 punti): stesso tasto "3" della
   versione 2D. A differenza del laser non serve mirare - il
   server aggancia da solo il nemico piu' vicino e lo insegue via
   pathfinding (vedi try_fire_missile/move_missiles in main.py) -
   quindi qui basta il tasto, senza leggere lo sguardo.
   ============================================================ */
window.addEventListener("keydown", e => {
  if (currentScreen !== "game") return;
  if (e.key !== "3") return;
  sendMsg({ type:"fire_missile" });
});

/* ============================================================
   MINE (bonus 200 punti): stesso tasto "1" della versione 2D. Il
   server e' l'autorita' su quante mine restano (mines_left) e ignora
   la richiesta se il bonus non e' sbloccato o le mine sono finite -
   qui basta il tasto, nessun controllo lato client (vedi try_place_mine
   in main.py). NB: nella 2D il tasto "1" gestisce anche la catena
   mortaio/bombolone/mongolfiera una volta finite le mine - per ora,
   come da richiesta, porto solo il primo anello (le mine).
   ============================================================ */
window.addEventListener("keydown", e => {
  if (currentScreen !== "game") return;
  if (e.key !== "1") return;
  sendMsg({ type:"place_mine" });
});

function enterGame(){
  showScreen("game");
  if (renderer) renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());
}
function exitGame(){
  document.getElementById("deadBanner").classList.add("hidden");
}

/* ============================================================
   STATO DI GIOCO -> POSIZIONI. Ogni giocatore (io compreso) e'
   renderizzato per interpolazione morbida verso l'ultima posizione
   confermata dal server (niente client-side prediction avanzata in
   questa prima versione: la si aggiunge in un secondo passo se il
   ping lo rende necessario).
   ============================================================ */
let myRenderX = 0, myRenderZ = 0, myInited = false;

function onState(msg){
  if ((msg.phase === "countdown" || msg.phase === "playing") && currentScreen !== "game"){
    enterGame();
  }

  const seen = new Set();
  msg.players.forEach(p => {
    seen.add(p.id);
    const wx = p.x*CELL + CELL/2, wz = p.y*CELL + CELL/2;

    playerColorHex[p.id] = hexToInt(COLOR_HEX[(p.colors||[])[0]] || "#5ab8ff");

    if (p.id === myId){
      if (!myInited){ myRenderX = wx; myRenderZ = wz; myInited = true; }
      else { myRenderX = wx; myRenderZ = wz; } // target aggiornato, il lerp e' nel render loop
      document.getElementById("hudScore").textContent = "punti: " + (p.points||0);
      document.getElementById("hudLives").textContent = "vite: " + (p.lives||0);
      document.getElementById("deadBanner").classList.toggle("hidden", p.alive !== false);
      // bonus 400 punti: missile guidato, sbloccato ma non ancora usato
      const hudMissile = document.getElementById("hudMissile");
      if (p.missile && p.missiles_left > 0){
        hudMissile.textContent = "missile: " + p.missiles_left + " (tasto 3)";
        hudMissile.classList.remove("hidden");
      } else {
        hudMissile.classList.add("hidden");
      }
      // bonus 200 punti: mine, sbloccate ma non ancora esaurite
      const hudMines = document.getElementById("hudMines");
      if (p.mines && p.mines_left > 0){
        hudMines.textContent = "mine: " + p.mines_left + " (tasto 1)";
        hudMines.classList.remove("hidden");
      } else {
        hudMines.classList.add("hidden");
      }
      return;
    }

    let rp = remotePlayers[p.id];
    if (!rp){
      const hex = playerColorHex[p.id];
      const group = makeCharacterMesh(hex);
      scene.add(group);
      rp = remotePlayers[p.id] = { group, x:wx, z:wz, targetX:wx, targetZ:wz };
    }
    rp.targetX = wx; rp.targetZ = wz;
    rp.group.visible = p.alive !== false;
    if (p.direction){
      const ang = { right:Math.PI/2, left:-Math.PI/2, down:Math.PI, up:0 }[p.direction];
      if (ang !== undefined) rp.group.rotation.y = ang;
    }
  });

  // rimuove chi ha lasciato la stanza per davvero
  Object.keys(remotePlayers).forEach(id => {
    if (!seen.has(id)){ scene.remove(remotePlayers[id].group); delete remotePlayers[id]; }
  });

  // bonus 150 punti: aggiorna il bersaglio di interpolazione di ogni
  // proiettile laser attivo con l'ultima posizione confermata dal server
  // (la creazione/rimozione restano gestite dagli eventi laser_fire/
  // laser_end in onGameEvent, qui si aggiorna solo il movimento fluido).
  const seenLasers = new Set();
  (msg.lasers||[]).forEach(lz => {
    seenLasers.add(lz.id);
    const entry = laserMeshes[lz.id];
    if (!entry) return; // laser_fire non ancora arrivato/processato: aspetta il prossimo state
    entry.targetX = lz.x*CELL + CELL/2;
    entry.targetZ = lz.y*CELL + CELL/2;
    const ang = { "1,0":Math.PI/2, "-1,0":-Math.PI/2, "0,1":Math.PI, "0,-1":0 }[lz.dir[0]+","+lz.dir[1]];
    if (ang !== undefined) entry.mesh.rotation.y = ang;
  });

  // bonus 400 punti: missile guidato. Il server manda gia' x/y continui
  // (vedi missile_public in main.py), quindi qui aggiorna solo il
  // bersaglio di interpolazione — creazione/rimozione restano gestite
  // dagli eventi missile_fire/missile_end/missile_reflect.
  (msg.missiles||[]).forEach(mz => {
    const entry = missileMeshes[mz.id];
    if (!entry) return; // missile_fire non ancora processato: aspetta il prossimo state
    entry.targetX = mz.x*CELL + CELL/2;
    entry.targetZ = mz.y*CELL + CELL/2;
  });

  // bonus 200 punti: mine. Sono ferme (nessuna interpolazione), quindi lo
  // state serve solo a: 1) crearle se mancano (es. ci si e' uniti a una
  // partita gia' iniziata e l'evento "mine_place" originale non e' mai
  // arrivato a questo client) e 2) rimuovere quelle disinnescate nel caso
  // l'evento "mine_boom"/"mine_destroyed" fosse andato perso.
  const seenMines = new Set();
  (msg.mines||[]).forEach(m => {
    seenMines.add(m.id);
    if (!mineMeshes[m.id]){
      const hex = playerColorHex[m.owner] !== undefined ? playerColorHex[m.owner] : 0x2bff5c;
      const mesh = makeMineMesh(hex);
      mesh.position.set(m.x*CELL + CELL/2, 0, m.y*CELL + CELL/2);
      scene.add(mesh);
      mineMeshes[m.id] = mesh;
    }
  });
  Object.keys(mineMeshes).forEach(id => {
    if (!seenMines.has(id)){ scene.remove(mineMeshes[id]); delete mineMeshes[id]; }
  });
}

function onGameEvent(msg){
  switch (msg.kind){
    case "pellet":
      (msg.cells||[]).forEach(c => {
        const key = c[0]+","+c[1];
        const m = pelletMeshes[key];
        if (m){ scene.remove(m); delete pelletMeshes[key]; }
      });
      break;
    case "pellet_respawn":
      (msg.cells||[]).forEach(c => {
        const key = c[0]+","+c[1];
        if (pelletMeshes[key]) return;
        const [x,y] = c;
        const isPower = powerPelletCells.has(key);
        const mat = new THREE.MeshStandardMaterial({ color:hexToInt(mazeTheme.pellet||"#ffb35c"), emissive:hexToInt(mazeTheme.pellet||"#ffb35c"), emissiveIntensity:0.6 });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(isPower?0.22:0.09, isPower?10:8, isPower?8:6), mat);
        mesh.position.set(x*CELL+CELL/2, isPower?0.5:0.35, y*CELL+CELL/2);
        scene.add(mesh);
        pelletMeshes[key] = mesh;
      });
      break;
    case "kill":
      showToast(msg.victim === myId ? "Sei stato eliminato!" : "Un giocatore \u00e8 stato eliminato");
      break;
    case "bonus":
      if (msg.player === myId) showToast("Bonus sbloccato: " + msg.bonus);
      break;
    case "laser_fire": {
      // bonus 150 punti: nuovo colpo di laser sparato (dal server, in
      // risposta al comando manuale del giocatore). Crea un piccolo
      // "proiettile" luminoso che il render loop muove morbidamente
      // verso la posizione confermata a ogni "event" successivo.
      const wx = msg.x*CELL + CELL/2, wz = msg.y*CELL + CELL/2;
      const geo = new THREE.CylinderGeometry(0.06, 0.06, 0.5, 6);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff5a4d, emissive: 0xff5a4d, emissiveIntensity: 1.4,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(wx, 0.65, wz);
      const ang = { right:Math.PI/2, left:-Math.PI/2, down:Math.PI, up:0 }[msg.dir];
      if (ang !== undefined) mesh.rotation.y = ang;
      mesh.rotation.x = Math.PI/2; // il cilindro punta lungo z di default
      scene.add(mesh);
      laserMeshes[msg.id] = { mesh, x:wx, z:wz, targetX:wx, targetZ:wz, dir: msg.dir };
      break;
    }
    case "laser_bounce":
    case "laser_reflect": {
      // il proiettile ha cambiato direzione (rimbalzo su un muro, o
      // respinto da una corazza laser): aggiorna solo il bersaglio di
      // interpolazione, l'orientamento visivo si aggiusta da solo col
      // prossimo "laser_fire"-like update se serve, altrimenti resta
      // comunque leggibile come lampo luminoso.
      const lz = laserMeshes[msg.id];
      if (lz){ const wx = msg.x*CELL+CELL/2, wz = msg.y*CELL+CELL/2; lz.targetX = wx; lz.targetZ = wz; }
      break;
    }
    case "laser_end": {
      const lz = laserMeshes[msg.id];
      if (lz){ scene.remove(lz.mesh); delete laserMeshes[msg.id]; }
      break;
    }
    case "missile_fire": {
      // bonus 400 punti: missile guidato lanciato. Il colore dell'alone
      // e' quello del proprietario (playerColorHex), cosi' si riconosce
      // subito di chi e' - stessa idea della versione 2D.
      if (msg.owner === myId) showToast("Missile lanciato (" + msg.left + " rimasti)");
      const wx = msg.x*CELL + CELL/2, wz = msg.y*CELL + CELL/2;
      const mesh = makeMissileMesh(playerColorHex[msg.owner] || 0x5ab8ff);
      mesh.position.set(wx, 0.55, wz);
      scene.add(mesh);
      missileMeshes[msg.id] = { mesh, x:wx, z:wz, targetX:wx, targetZ:wz };
      break;
    }
    case "missile_reflect": {
      // respinto da una corazza laser: esplode li' ma NON viene rimosso
      // dal client - il server manda comunque un successivo missile_end
      // (stesso comportamento della versione 2D), quindi qui e' solo un
      // lampo visivo in piu'.
      spawnExplosion(msg.x*CELL+CELL/2, msg.y*CELL+CELL/2, 0x4dffe8);
      break;
    }
    case "missile_end": {
      spawnExplosion(msg.x*CELL+CELL/2, msg.y*CELL+CELL/2, 0x8fd3ff);
      const mz = missileMeshes[msg.id];
      if (mz){ scene.remove(mz.mesh); delete missileMeshes[msg.id]; }
      break;
    }
    case "mine_place": {
      // La mesh vera e propria viene creata dal prossimo onState (blocco
      // msg.mines) - qui serve solo il feedback per chi l'ha piazzata.
      if (msg.player === myId) showToast("Mina posata (" + msg.left + " rimaste)");
      break;
    }
    case "mine_boom": {
      // Mina calpestata: stesso colore/effetto del missile che esplode,
      // come nella 2D (playBalloonBomb riusato per lo stesso "botto").
      spawnExplosion(msg.x*CELL+CELL/2, msg.y*CELL+CELL/2, 0xff9d1f);
      const mm = mineMeshes[msg.id];
      if (mm){ scene.remove(mm); delete mineMeshes[msg.id]; }
      break;
    }
    case "mine_destroyed": {
      // Disinnescata da corazza/bombolone/mongolfiera (mina AVVERSARIA:
      // le proprie restano sempre intatte, come nella 2D). Nel caso di
      // rimozione per disconnessione del proprietario il server non manda
      // x/y (la mina sparisce e basta, senza "botto" visivo).
      if (msg.x !== undefined && msg.y !== undefined){
        spawnExplosion(msg.x*CELL+CELL/2, msg.y*CELL+CELL/2, 0x8fe0ff);
      }
      const mm = mineMeshes[msg.id];
      if (mm){ scene.remove(mm); delete mineMeshes[msg.id]; }
      break;
    }
  }
}

let toastTimer = null;
function showToast(text){
  const el = document.getElementById("toast");
  el.textContent = text; el.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (!scene || currentScreen !== "game"){ return; }
  const dt = Math.min(clock.getDelta(), 0.05);

  // smorza gli scatti dei pacchetti di rete interpolando verso l'ultima
  // posizione nota invece di scattare di colpo ad ogni "state" ricevuto.
  const LERP = Math.min(1, dt*10);
  Object.values(remotePlayers).forEach(rp => {
    rp.x += (rp.targetX - rp.x) * LERP;
    rp.z += (rp.targetZ - rp.z) * LERP;
    rp.group.position.set(rp.x, 0, rp.z);
  });
  // bonus 150 punti: proiettili laser, stessa interpolazione morbida
  const LASER_LERP = Math.min(1, dt*14); // leggermente piu' reattivo: il proiettile e' veloce
  Object.values(laserMeshes).forEach(lz => {
    lz.x += (lz.targetX - lz.x) * LASER_LERP;
    lz.z += (lz.targetZ - lz.z) * LASER_LERP;
    lz.mesh.position.set(lz.x, 0.65, lz.z);
  });
  // bonus 400 punti: missile guidato, stessa interpolazione dei laser
  Object.values(missileMeshes).forEach(mz => {
    mz.x += (mz.targetX - mz.x) * LASER_LERP;
    mz.z += (mz.targetZ - mz.z) * LASER_LERP;
    mz.mesh.position.set(mz.x, 0.55, mz.z);
  });
  // bonus 200 punti: mine ferme, solo il nucleo bianco pulsa (stessa idea
  // del nucleo lampeggiante di drawMines nella 2D) per restare visibile.
  const minePulse = 0.75 + 0.25*Math.sin(performance.now()*0.006);
  Object.values(mineMeshes).forEach(mesh => {
    if (mesh.userData.core) mesh.userData.core.scale.setScalar(minePulse);
  });
  // esplosioni (missile_end/missile_reflect, in futuro anche mine/superbomb):
  // si espandono e sfumano in ~350ms, poi si rimuovono da sole.
  const EXPLOSION_MS = 350;
  const now3d = performance.now();
  for (let i = explosions.length - 1; i >= 0; i--){
    const ex = explosions[i];
    const t = (now3d - ex.start) / EXPLOSION_MS;
    if (t >= 1){ scene.remove(ex.mesh); explosions.splice(i, 1); continue; }
    ex.mesh.scale.setScalar(1 + t*2.4);
    ex.mesh.material.opacity = Math.max(0, 0.9 * (1 - t));
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  camera.position.set(myRenderX, EYE_HEIGHT, myRenderZ);
  torch.position.set(myRenderX, 2, myRenderZ);

  renderer.render(scene, camera);
}
animate();
</script>

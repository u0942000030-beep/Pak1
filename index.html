<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Pac-Man Arena 3D — Prima Persona (online)</title>
<style>
  html, body { margin:0; height:100%; background:#050203; overflow:hidden;
    font-family: 'Courier New', monospace; color:#e8e0d8; }
  .hidden { display:none !important; }

  /* ---- schermate overlay (connessione / lobby / fine round) ---- */
  .overlay {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:radial-gradient(ellipse at center, #1a0808 0%, #050203 75%);
  }
  .panel {
    background:#0d0404; border:1px solid #4a1414; border-radius:6px;
    padding:26px 30px; width:340px; box-shadow:0 0 40px #00000090;
  }
  .panel h1 { font-size:16px; letter-spacing:2px; color:#ff8a6e; margin:0 0 18px; text-transform:uppercase; }
  .panel label { display:block; font-size:11px; color:#c8a898; margin:12px 0 4px; }
  .panel input {
    width:100%; box-sizing:border-box; background:#1a0a0a; border:1px solid #4a1414;
    color:#e8e0d8; padding:8px 10px; font-family:inherit; font-size:13px; border-radius:3px;
  }
  .tabs { display:flex; gap:6px; margin-top:6px; }
  .tabs button {
    flex:1; background:#1a0a0a; border:1px solid #4a1414; color:#c8a898;
    padding:7px 0; font-family:inherit; font-size:11px; cursor:pointer; border-radius:3px;
  }
  .tabs button.active { background:#ff5a4d; color:#1a0202; border-color:#ff5a4d; font-weight:bold; }
  .btn-main {
    width:100%; margin-top:18px; padding:10px 0; background:#ff5a4d; color:#1a0202;
    border:none; border-radius:3px; font-family:inherit; font-weight:bold; font-size:13px;
    letter-spacing:1px; cursor:pointer;
  }
  .btn-main:disabled { opacity:0.4; cursor:default; }
  .err { color:#ff6a6a; font-size:11px; margin-top:10px; min-height:14px; }

  #lobbyList { list-style:none; padding:0; margin:14px 0; max-height:180px; overflow:auto; }
  #lobbyList li { padding:6px 8px; font-size:12px; border-bottom:1px solid #2a1010; display:flex; justify-content:space-between; }
  #lobbyList li .tag { color:#ff8a6e; font-size:10px; }

  /* ---- HUD in partita ---- */
  #crosshair {
    position:fixed; top:50%; left:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%; background:#ff5a4d;
    box-shadow:0 0 8px #ff5a4d; pointer-events:none; z-index:5;
  }
  #hud {
    position:fixed; top:12px; left:12px; z-index:5; font-size:12px; text-shadow:0 0 6px #000;
    background:#00000060; padding:8px 12px; border-radius:4px; border:1px solid #4a141460;
  }
  #hud div { margin:2px 0; }
  #hudScore { color:#ffd23f; }
  #hudLives { color:#ff5a5a; }
  #toast {
    position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:6;
    background:#1a0a0acc; border:1px solid #ff5a4d; color:#ffcaa8; padding:8px 16px;
    border-radius:4px; font-size:12px; opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  #hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5;
    color:#c8c0b8; font-size:12px; opacity:0.7; text-align:center; text-shadow:0 0 6px #000;
  }
  #deadBanner {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); z-index:8;
    color:#ff4136; font-size:26px; letter-spacing:3px; text-shadow:0 0 12px #000;
  }
</style>
</head>
<body>

<!-- ===================== SCHERMATA CONNESSIONE ===================== -->
<div id="screenConnect" class="overlay">
  <div class="panel">
    <h1>Pac-Man Arena 3D</h1>
    <div class="tabs">
      <button id="tabCreate" class="active">Crea stanza</button>
      <button id="tabJoin">Unisciti</button>
    </div>
    <label>Server</label>
    <input id="inpIp" placeholder="127.0.0.1">
    <label>Porta (vuota se hosted su HTTPS)</label>
    <input id="inpPort" placeholder="8765">
    <label>Nome</label>
    <input id="inpName" placeholder="Player" maxlength="16">
    <div id="joinCodeField" class="hidden">
      <label>Codice stanza</label>
      <input id="inpCode" maxlength="6" style="text-transform:uppercase">
    </div>
    <button id="btnConnect" class="btn-main">Crea stanza</button>
    <div id="connectError" class="err"></div>
  </div>
</div>

<!-- ===================== SCHERMATA LOBBY ===================== -->
<div id="screenLobby" class="overlay hidden">
  <div class="panel">
    <h1>Lobby — <span id="lobbyCode">----</span></h1>
    <ul id="lobbyList"></ul>
    <button id="btnStart" class="btn-main">Avvia partita</button>
    <div id="lobbyHint" style="font-size:11px;color:#c8a898;margin-top:10px;"></div>
  </div>
</div>

<!-- ===================== HUD DI GIOCO ===================== -->
<div id="crosshair" class="hidden"></div>
<div id="hud" class="hidden">
  <div>stanza <b id="hudRoom"></b> — <span id="hudMapName"></span></div>
  <div id="hudScore">punti: 0</div>
  <div id="hudLives">vite: 0</div>
</div>
<div id="toast"></div>
<div id="hint" class="hidden">Click per guardarti intorno — WASD = Nord/Sud/Ovest/Est fissi (come nel gioco originale) — mouse = solo sguardo</div>
<div id="deadBanner" class="hidden">SEI MORTO — attendi il respawn</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   COSTANTI CONDIVISE COL SERVER (common.py) — solo quelle che
   servono al client per interpretare i messaggi.
   ============================================================ */
const DIR_VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEY_TO_DIR = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right",
  W: "up", S: "down", A: "left", D: "right",
};
const COLOR_HEX = {
  azzurro:"#29d6ff", giallo:"#ffd400", verde:"#33ff77", bianco:"#f5f5f5", rosa:"#ff5fd1",
  arancione:"#ff9d1f", rosso:"#ff4136", viola:"#9b3bff", lime:"#c6ff3f", oro:"#ffcf40",
  ciano:"#22e6ff", magenta:"#ff2b9e", grigio:"#c7d0d8", marrone:"#b5651d",
  blu_notte:"#5b6bff", corallo:"#ff5a36", nero:"#000000",
};
const CELL = 2;       // dimensione di una cella nel mondo 3D
const WALL_H = 3.2;
const EYE_HEIGHT = 1.15;

/* ============================================================
   STATO DI CONNESSIONE (stesso identico protocollo di index.html:
   create_room/join_room -> room_created/joined -> select_color/
   select_character -> start_game -> round_start -> state/event)
   ============================================================ */
let ws = null;
let myId = null, roomCode = null, myName = "Player", iAmHost = false;
let joinMode = false;

let maze = [], mazeW = 0, mazeH = 0, mazeTheme = null;

function sendMsg(obj){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function connect(ip, port, onOpen){
  const secure = location.protocol === "https:";
  const scheme = secure ? "wss://" : "ws://";
  const effectivePort = port || (secure ? "" : "8765");
  const portPart = effectivePort ? (":" + effectivePort) : "";
  const url = scheme + ip + portPart + "/";
  const errEl = document.getElementById("connectError");
  errEl.textContent = "Connessione a " + url + " in corso\u2026";
  // Se la pagina e' su HTTPS (es. anteprima artifact) e si prova un
  // ws:// non cifrato verso un indirizzo locale, il browser blocca la
  // connessione per policy "mixed content" - spesso SENZA lanciare
  // alcun errore visibile: onopen/onerror non scattano mai e il
  // pulsante sembra "non fare niente". Questo timeout rende visibile
  // anche quel caso.
  const openTimeout = setTimeout(() => {
    if (ws && ws.readyState !== WebSocket.OPEN){
      errEl.textContent = secure
        ? "Nessuna risposta da " + url + ". Se il server e' locale (127.0.0.1) e questa pagina e' aperta dentro l'anteprima HTTPS di Claude, il browser blocca la connessione ws:// non cifrata (\"mixed content\"): scarica questo file e aprilo direttamente nel browser (doppio click, o servilo in locale), non dentro l'anteprima."
        : "Nessuna risposta da " + url + ". Controlla che il server sia avviato e l'indirizzo/porta siano giusti.";
    }
  }, 3500);
  try { ws = new WebSocket(url); }
  catch(e){ clearTimeout(openTimeout); errEl.textContent = "Indirizzo non valido: " + e.message; return; }
  ws.onopen = () => { clearTimeout(openTimeout); errEl.textContent = ""; onOpen(); };
  ws.onmessage = ev => handleMessage(JSON.parse(ev.data));
  ws.onerror = () => { clearTimeout(openTimeout); errEl.textContent = "Errore di connessione al server (" + url + ")."; };
  ws.onclose = () => { clearTimeout(openTimeout); if (currentScreen !== "connect") errEl.textContent = "Connessione persa."; };
}

/* ---- UI: tab crea/unisciti ---- */
document.getElementById("tabCreate").addEventListener("click", () => {
  joinMode = false;
  document.getElementById("tabCreate").classList.add("active");
  document.getElementById("tabJoin").classList.remove("active");
  document.getElementById("joinCodeField").classList.add("hidden");
  document.getElementById("btnConnect").textContent = "Crea stanza";
});
document.getElementById("tabJoin").addEventListener("click", () => {
  joinMode = true;
  document.getElementById("tabJoin").classList.add("active");
  document.getElementById("tabCreate").classList.remove("active");
  document.getElementById("joinCodeField").classList.remove("hidden");
  document.getElementById("btnConnect").textContent = "Unisciti alla stanza";
});
document.getElementById("btnConnect").addEventListener("click", () => {
  const errEl = document.getElementById("connectError");
  errEl.textContent = "";
  const ip = (document.getElementById("inpIp").value || "127.0.0.1").trim();
  const port = document.getElementById("inpPort").value.trim();
  myName = (document.getElementById("inpName").value || "Player").trim().slice(0,16) || "Player";
  if (joinMode && !document.getElementById("inpCode").value.trim()){
    errEl.textContent = "Inserisci il codice della stanza."; return;
  }
  connect(ip, port, () => {
    if (joinMode){
      const code = document.getElementById("inpCode").value.trim().toUpperCase();
      sendMsg({ type:"join_room", code, name: myName });
    } else {
      sendMsg({ type:"create_room", name: myName });
    }
  });
});

/* ============================================================
   GESTIONE MESSAGGI (stessi "type"/"kind" di index.html)
   ============================================================ */
let currentScreen = "connect";
function showScreen(name){
  currentScreen = name;
  document.getElementById("screenConnect").classList.toggle("hidden", name !== "connect");
  document.getElementById("screenLobby").classList.toggle("hidden", name !== "lobby");
  document.getElementById("crosshair").classList.toggle("hidden", name !== "game");
  document.getElementById("hud").classList.toggle("hidden", name !== "game");
  document.getElementById("hint").classList.toggle("hidden", name !== "game");
}

function handleMessage(msg){
  switch (msg.type){
    case "room_created": case "joined": case "rejoined":
      myId = msg.player_id; roomCode = msg.code;
      applyMapData(msg);
      document.getElementById("hudRoom").textContent = roomCode;
      document.getElementById("lobbyCode").textContent = roomCode;
      // Auto-selezione colore/personaggio: il prototipo salta la UI di
      // scelta colore/personaggio di index.html, ne sceglie uno libero
      // in automatico cosi' si puo' entrare in game piu' in fretta.
      sendMsg({ type:"select_color", colors:[myAutoColor()] });
      sendMsg({ type:"select_character", character:"classic" });
      showScreen("lobby");
      break;
    case "error":
      document.getElementById("connectError").textContent = msg.message;
      document.getElementById("lobbyHint").textContent = msg.message;
      break;
    case "lobby_state":
      onLobbyState(msg);
      break;
    case "round_start":
      applyMapData(msg);
      enterGame();
      break;
    case "state":
      onState(msg);
      break;
    case "event":
      onGameEvent(msg);
      break;
    case "round_end":
      onRoundEnd(msg);
      break;
    case "rtt_ping":
      sendMsg({ type:"rtt_pong", t: msg.t });
      break;
  }
}

let lobbyPlayersCache = [];
function myAutoColor(){
  const taken = new Set(lobbyPlayersCache.map(p => (p.colors||[])[0]).filter(Boolean));
  const pool = ["giallo","azzurro","verde","rosa","arancione","viola","lime","corallo"];
  return pool.find(c => !taken.has(c)) || "bianco";
}

function onLobbyState(msg){
  lobbyPlayersCache = msg.players;
  const me = msg.players.find(p => p.id === myId);
  iAmHost = !!(me && me.host);
  const list = document.getElementById("lobbyList");
  list.innerHTML = "";
  msg.players.forEach(p => {
    const li = document.createElement("li");
    const hex = COLOR_HEX[(p.colors||[])[0]] || "#888";
    li.innerHTML = '<span style="color:'+hex+'">\u25CF ' + p.name + '</span>' +
      '<span class="tag">' + (p.host ? "HOST" : "") + '</span>';
    list.appendChild(li);
  });
  document.getElementById("btnStart").style.display = iAmHost ? "block" : "none";
  document.getElementById("lobbyHint").textContent = iAmHost
    ? "Sei l'host: premi Avvia quando siete pronti."
    : "In attesa che l'host avvii la partita\u2026";
}
document.getElementById("btnStart").addEventListener("click", () => sendMsg({ type:"start_game" }));

function onRoundEnd(msg){
  exitGame();
  const rows = Object.keys(msg.scores||{}).map(id => ({
    id, name:(msg.names&&msg.names[id])||id, pts: msg.scores[id]
  })).sort((a,b)=>b.pts-a.pts);
  document.getElementById("lobbyHint").textContent = "Round finito. Classifica: " +
    rows.map((r,i)=> (i+1)+". "+r.name+" ("+r.pts+"pt)").join(" \u00b7 ");
  showScreen("lobby");
}

/* ============================================================
   MAPPA -> SCENA 3D
   ============================================================ */
function isWall(cx, cy){
  if (cx < 0 || cy < 0 || cx >= mazeW || cy >= mazeH) return true;
  return maze[cy][cx] === "#";
}
function hexToInt(h){ return parseInt((h||"#333333").replace("#",""), 16); }

let scene, camera, renderer, torch;
let wallMeshGroup = null;
let pelletMeshes = {};   // "x,y" -> THREE.Mesh
let powerPelletCells = new Set();
let remotePlayers = {};  // id -> {group, targetX, targetZ, colorHex}

function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.05, 100);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x402020, 0.55));
  torch = new THREE.PointLight(0xffffff, 1.4, 9, 2);
  scene.add(torch);
  scene.add(new THREE.HemisphereLight(0x553030, 0x0a0202, 0.4));
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function applyMapData(msg){
  maze = msg.maze; mazeW = msg.maze_w; mazeH = msg.maze_h;
  mazeTheme = msg.theme || {};
  powerPelletCells = new Set((msg.power_pellets||[]).map(c => c[0]+","+c[1]));
  document.getElementById("hudMapName").textContent = msg.maze_name || "";

  if (!scene) initThree();

  // ripulisce la scena (muri/pallini della mappa precedente, se ce n'era una)
  if (wallMeshGroup) scene.remove(wallMeshGroup);
  Object.values(pelletMeshes).forEach(m => scene.remove(m));
  pelletMeshes = {};

  const wallColor  = hexToInt(mazeTheme.wall  || "#2a0606");
  const edgeColor  = hexToInt(mazeTheme.edge  || "#c81e2e");
  const bgColor    = hexToInt(mazeTheme.bg    || "#0d0202");
  const pelletColor= hexToInt(mazeTheme.pellet|| "#ffb35c");
  scene.background = new THREE.Color(bgColor);
  scene.fog = new THREE.Fog(bgColor, 6, 34);
  torch.color = new THREE.Color(hexToInt(mazeTheme.glow || "#ff5a4d"));

  // pavimento
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(mazeW*CELL, mazeH*CELL),
    new THREE.MeshStandardMaterial({ color:bgColor, roughness:1 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.set(mazeW*CELL/2, 0, mazeH*CELL/2);
  floor.name = "__floor";
  scene.add(floor);

  // muri, un InstancedMesh per performance
  const wallGeo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const wallMat = new THREE.MeshStandardMaterial({ color:wallColor, emissive:edgeColor, emissiveIntensity:0.15, roughness:0.85 });
  let count = 0;
  for (let y=0;y<mazeH;y++) for (let x=0;x<mazeW;x++) if (isWall(x,y)) count++;
  const wm = new THREE.InstancedMesh(wallGeo, wallMat, count);
  let wi = 0;
  const dummy = new THREE.Object3D();
  for (let y=0;y<mazeH;y++){
    for (let x=0;x<mazeW;x++){
      if (!isWall(x,y)) continue;
      dummy.position.set(x*CELL+CELL/2, WALL_H/2, y*CELL+CELL/2);
      dummy.updateMatrix();
      wm.setMatrixAt(wi++, dummy.matrix);
    }
  }
  wallMeshGroup = new THREE.Group();
  wallMeshGroup.add(wm);
  scene.add(wallMeshGroup);

  // pallini: quelli "ancora presenti" secondo il server (msg.pellets)
  const remaining = new Set((msg.pellets||[]).map(c => c[0]+","+c[1]));
  const normalGeo = new THREE.SphereGeometry(0.09, 8, 6);
  const powerGeo = new THREE.SphereGeometry(0.22, 10, 8);
  const pelletMat = new THREE.MeshStandardMaterial({ color:pelletColor, emissive:pelletColor, emissiveIntensity:0.6 });
  remaining.forEach(key => {
    const [x,y] = key.split(",").map(Number);
    const isPower = powerPelletCells.has(key);
    const mesh = new THREE.Mesh(isPower ? powerGeo : normalGeo, pelletMat);
    mesh.position.set(x*CELL+CELL/2, isPower ? 0.5 : 0.35, y*CELL+CELL/2);
    scene.add(mesh);
    pelletMeshes[key] = mesh;
  });
}

/* ---- costruisce un personaggio semplice (cilindro+sfere: niente
   CapsuleGeometry, non esiste nella versione r128 di three.js usata qui) ---- */
function makeCharacterMesh(colorHex){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:colorHex, emissive:colorHex, emissiveIntensity:0.12 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.5,12), mat);
  cyl.position.y = 0.56; g.add(cyl);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,8), mat);
  top.position.y = 0.81; g.add(top);
  const bot = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,8), mat);
  bot.position.y = 0.31; g.add(bot);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.11,0.3,8),
    new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x222222 }));
  nose.rotation.x = Math.PI/2;
  nose.position.set(0, 0.6, 0.4);
  g.add(nose);
  return g;
}

/* ============================================================
   MOVIMENTO: identico al gioco originale — un tasto NON avvia/ferma
   il movimento, imposta solo la PROSSIMA direzione desiderata (il
   personaggio e' sempre in moto lato server). Le direzioni sono
   fisse rispetto alla mappa (Nord/Sud/Ovest/Est), non rispetto allo
   sguardo: esattamente come nella versione 2D, il mouse qui serve
   SOLO a guardarsi intorno.
   ============================================================ */
let lastRequestedDir = null;
function requestDir(dir){
  if (dir !== lastRequestedDir) lastRequestedDir = dir;
  sendMsg({ type:"move", direction:dir });
}
const keysDown = {};
window.addEventListener("keydown", e => {
  if (currentScreen !== "game") return;
  const dir = KEY_TO_DIR[e.key];
  if (dir && !keysDown[e.key]) requestDir(dir);
  keysDown[e.key] = true;
});
window.addEventListener("keyup", e => { keysDown[e.key] = false; });

let yaw = 0, pitch = 0, locked = false;
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement && document.pointerLockElement.tagName === "CANVAS";
});
document.addEventListener("mousemove", e => {
  if (!locked) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, pitch));
});

function enterGame(){
  showScreen("game");
  if (renderer) renderer.domElement.addEventListener("click", () => renderer.domElement.requestPointerLock());
}
function exitGame(){
  document.getElementById("deadBanner").classList.add("hidden");
}

/* ============================================================
   STATO DI GIOCO -> POSIZIONI. Ogni giocatore (io compreso) e'
   renderizzato per interpolazione morbida verso l'ultima posizione
   confermata dal server (niente client-side prediction avanzata in
   questa prima versione: la si aggiunge in un secondo passo se il
   ping lo rende necessario).
   ============================================================ */
let myRenderX = 0, myRenderZ = 0, myInited = false;

function onState(msg){
  if ((msg.phase === "countdown" || msg.phase === "playing") && currentScreen !== "game"){
    enterGame();
  }

  const seen = new Set();
  msg.players.forEach(p => {
    seen.add(p.id);
    const wx = p.x*CELL + CELL/2, wz = p.y*CELL + CELL/2;

    if (p.id === myId){
      if (!myInited){ myRenderX = wx; myRenderZ = wz; myInited = true; }
      else { myRenderX = wx; myRenderZ = wz; } // target aggiornato, il lerp e' nel render loop
      document.getElementById("hudScore").textContent = "punti: " + (p.points||0);
      document.getElementById("hudLives").textContent = "vite: " + (p.lives||0);
      document.getElementById("deadBanner").classList.toggle("hidden", p.alive !== false);
      return;
    }

    let rp = remotePlayers[p.id];
    if (!rp){
      const hex = hexToInt(COLOR_HEX[(p.colors||[])[0]] || "#888888");
      const group = makeCharacterMesh(hex);
      scene.add(group);
      rp = remotePlayers[p.id] = { group, x:wx, z:wz, targetX:wx, targetZ:wz };
    }
    rp.targetX = wx; rp.targetZ = wz;
    rp.group.visible = p.alive !== false;
    if (p.direction){
      const ang = { right:Math.PI/2, left:-Math.PI/2, down:Math.PI, up:0 }[p.direction];
      if (ang !== undefined) rp.group.rotation.y = ang;
    }
  });

  // rimuove chi ha lasciato la stanza per davvero
  Object.keys(remotePlayers).forEach(id => {
    if (!seen.has(id)){ scene.remove(remotePlayers[id].group); delete remotePlayers[id]; }
  });
}

function onGameEvent(msg){
  switch (msg.kind){
    case "pellet":
      (msg.cells||[]).forEach(c => {
        const key = c[0]+","+c[1];
        const m = pelletMeshes[key];
        if (m){ scene.remove(m); delete pelletMeshes[key]; }
      });
      break;
    case "pellet_respawn":
      (msg.cells||[]).forEach(c => {
        const key = c[0]+","+c[1];
        if (pelletMeshes[key]) return;
        const [x,y] = c;
        const isPower = powerPelletCells.has(key);
        const mat = new THREE.MeshStandardMaterial({ color:hexToInt(mazeTheme.pellet||"#ffb35c"), emissive:hexToInt(mazeTheme.pellet||"#ffb35c"), emissiveIntensity:0.6 });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(isPower?0.22:0.09, isPower?10:8, isPower?8:6), mat);
        mesh.position.set(x*CELL+CELL/2, isPower?0.5:0.35, y*CELL+CELL/2);
        scene.add(mesh);
        pelletMeshes[key] = mesh;
      });
      break;
    case "kill":
      showToast(msg.victim === myId ? "Sei stato eliminato!" : "Un giocatore \u00e8 stato eliminato");
      break;
    case "bonus":
      if (msg.player === myId) showToast("Bonus sbloccato: " + msg.bonus);
      break;
  }
}

let toastTimer = null;
function showToast(text){
  const el = document.getElementById("toast");
  el.textContent = text; el.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (!scene || currentScreen !== "game"){ return; }
  const dt = Math.min(clock.getDelta(), 0.05);

  // smorza gli scatti dei pacchetti di rete interpolando verso l'ultima
  // posizione nota invece di scattare di colpo ad ogni "state" ricevuto.
  const LERP = Math.min(1, dt*10);
  Object.values(remotePlayers).forEach(rp => {
    rp.x += (rp.targetX - rp.x) * LERP;
    rp.z += (rp.targetZ - rp.z) * LERP;
    rp.group.position.set(rp.x, 0, rp.z);
  });

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  camera.position.set(myRenderX, EYE_HEIGHT, myRenderZ);
  torch.position.set(myRenderX, 2, myRenderZ);

  renderer.render(scene, camera);
}
animate();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROBOT ARENA // OFFICINA</title>
<style>
  :root{
    --bg:#05030a; --panel:#0c0816; --panel2:#0f0a1c; --line:#2a1a4a;
    --accent:#a24bff; --accent-glow:#e3c6ff; --data:#4bd6ff;
    --text:#d8cbe8; --dim:#8a7aa8; --danger:#ff5a4d; --ok:#7dffa8; --warn:#ffb35c;
  }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:'Courier New', monospace; color:var(--text); }
  *{ box-sizing:border-box; }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .hidden{ display:none !important; }

  /* ---------- grid di sfondo (blueprint) ---------- */
  #bgGrid{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(162,75,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(162,75,255,0.06) 1px, transparent 1px);
    background-size:34px 34px; }

  /* ---------- schermata AUTH ---------- */
  #authScreen{ position:fixed; inset:0; z-index:10; display:flex; align-items:center;
    justify-content:center; background:radial-gradient(ellipse at center, #140a26 0%, #05030a 75%); }
  .authPanel{ width:340px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:26px 24px; box-shadow:0 0 40px rgba(162,75,255,0.12); }
  .eyebrow{ font-size:10px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:4px; }
  .authPanel h1{ font-size:17px; letter-spacing:2px; color:var(--accent-glow); margin:0 0 18px;
    text-transform:uppercase; text-shadow:0 0 12px rgba(162,75,255,0.5); }
  .authPanel label{ display:block; font-size:11px; color:var(--dim); margin:12px 0 4px; letter-spacing:1px; }
  .authPanel input{ width:100%; background:#140a26; border:1px solid var(--line); color:var(--text);
    padding:9px 10px; font-family:inherit; font-size:13px; border-radius:3px; }
  .authPanel input:focus{ outline:none; border-color:var(--accent); }
  .tabs{ display:flex; gap:6px; margin-top:4px; }
  .tabs button{ flex:1; background:#140a26; border:1px solid var(--line); color:var(--dim);
    padding:7px 0; font-family:inherit; font-size:11px; letter-spacing:1px; cursor:pointer; border-radius:3px; }
  .tabs button.active{ background:var(--accent); color:#0a0212; border-color:var(--accent); font-weight:bold; }
  .btnMain{ width:100%; margin-top:18px; padding:11px 0; background:var(--accent); color:#0a0212;
    border:none; border-radius:3px; font-family:inherit; font-weight:bold; font-size:13px; letter-spacing:1px;
    cursor:pointer; text-transform:uppercase; }
  .btnMain:hover{ filter:brightness(1.15); }
  .btnMain:disabled{ opacity:0.4; cursor:default; }
  .authErr{ color:var(--danger); font-size:11px; margin-top:10px; min-height:14px; }
  .serverRow{ font-size:10px; color:var(--dim); margin-top:16px; }
  .serverRow input{ margin-top:4px; background:#0a0518; font-size:11px; padding:6px 8px; }

  /* ---------- schermata GARAGE ---------- */
  #garageScreen{ position:fixed; inset:0; z-index:5; display:flex; }

  #viewport{ position:relative; flex:1 1 60%; min-width:0; }
  #viewport canvas{ display:block; width:100%; height:100%; }

  #topBar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:14px 20px; z-index:2; pointer-events:none; }
  #topBar .brand{ font-size:12px; letter-spacing:3px; color:var(--accent-glow); text-transform:uppercase;
    text-shadow:0 0 10px rgba(162,75,255,0.6); }
  #topBar .brand small{ display:block; font-size:9px; letter-spacing:2px; color:var(--dim); margin-top:2px; }
  #topBar .userBox{ display:flex; align-items:center; gap:10px; pointer-events:auto; }
  #topBar .userBox span{ font-size:11px; color:var(--dim); }
  #logoutBtn{ background:transparent; border:1px solid var(--line); color:var(--dim); font-family:inherit;
    font-size:10px; letter-spacing:1px; padding:6px 10px; border-radius:3px; cursor:pointer; }
  #logoutBtn:hover{ border-color:var(--danger); color:var(--danger); }

  #robotStrip{ position:absolute; left:20px; bottom:20px; display:flex; gap:8px; z-index:2; flex-wrap:wrap; max-width:calc(100% - 40px); }
  .robotChip{ background:rgba(12,8,22,0.85); border:1px solid var(--line); color:var(--dim); font-family:inherit;
    font-size:10px; padding:7px 12px; border-radius:3px; cursor:pointer; letter-spacing:0.5px; white-space:nowrap; }
  .robotChip.active{ border-color:var(--accent); color:var(--accent-glow); box-shadow:0 0 10px rgba(162,75,255,0.3); }
  .robotChip.newChip{ color:var(--ok); border-color:#1a4a2a; }

  #sidePanel{ flex:0 0 380px; max-width:42vw; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; z-index:2; overflow:hidden; }

  #nameRow{ padding:16px 16px 10px; border-bottom:1px solid var(--line); }
  #nameRow .eyebrow{ margin-bottom:6px; }
  #robotNameInput{ width:100%; background:#140a26; border:1px solid var(--line); color:var(--text);
    padding:9px 10px; font-family:inherit; font-size:13px; border-radius:3px; letter-spacing:0.5px; }
  #robotNameInput:focus{ outline:none; border-color:var(--accent); }

  #slotTabs{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); flex-shrink:0; }
  #slotTabs button{ flex:1 1 22%; min-width:52px; background:var(--panel2); border:none; border-right:1px solid var(--line);
    border-bottom:1px solid var(--line); color:var(--dim); font-family:inherit; font-size:8.5px; letter-spacing:0.5px;
    padding:9px 2px; cursor:pointer; text-transform:uppercase; }
  #slotTabs button:last-child{ border-right:none; }
  #slotTabs button.active{ background:var(--accent); color:#0a0212; font-weight:bold; }

  #pieceList{ flex:1 1 auto; overflow-y:auto; padding:12px; min-height:0; }
  .pieceCard{ background:#0f0a1c; border:1px solid var(--line); border-radius:4px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer; transition:border-color .1s; }
  .pieceCard:hover{ border-color:#4a2a7a; }
  .pieceCard.selected{ border-color:var(--accent); box-shadow:0 0 12px rgba(162,75,255,0.25); background:#160b2c; }
  .pieceCard .pName{ font-size:12px; color:var(--text); letter-spacing:0.5px; display:flex; justify-content:space-between; }
  .pieceCard .pName .check{ color:var(--accent-glow); }
  .pieceCard .pStats{ font-size:10px; color:var(--data); margin-top:5px; letter-spacing:0.5px; }
  .pieceCard .pCost{ font-size:9px; color:var(--dim); margin-top:3px; }
  .slotHint{ font-size:10px; color:var(--dim); padding:0 2px 10px; letter-spacing:0.5px; }

  /* ---------- costruttore catena arto (braccia/gambe) ---------- */
  .chainMsg{ font-size:10px; padding:6px 8px; border-radius:3px; margin-bottom:10px; letter-spacing:0.3px; }
  .chainMsg.ok{ color:var(--ok); background:rgba(125,255,168,0.08); border:1px solid rgba(125,255,168,0.25); }
  .chainMsg.err{ color:var(--warn); background:rgba(255,179,92,0.08); border:1px solid rgba(255,179,92,0.25); }
  .chainList{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .chainStep{ display:flex; align-items:center; gap:6px; background:#0f0a1c; border:1px solid var(--line);
    border-radius:4px; padding:6px 8px; font-size:10.5px; }
  .chainStep .stepIdx{ color:var(--dim); font-size:9px; min-width:14px; }
  .chainStep .stepName{ flex:1; color:var(--text); }
  .chainStep .stepBtns{ display:flex; gap:3px; }
  .chainStep button{ background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:3px;
    font-family:inherit; font-size:10px; width:20px; height:20px; cursor:pointer; line-height:1; }
  .chainStep button:hover{ border-color:var(--accent); color:var(--accent-glow); }
  .chainStep button.rm:hover{ border-color:var(--danger); color:var(--danger); }
  .chainEmpty{ font-size:10px; color:var(--dim); padding:10px 4px; text-align:center; border:1px dashed var(--line); border-radius:4px; }
  .chainCatTabs{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .chainCatTabs button{ background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:3px;
    font-family:inherit; font-size:9.5px; letter-spacing:0.3px; padding:5px 8px; cursor:pointer; }
  .chainCatTabs button.active{ background:var(--accent); color:#0a0212; border-color:var(--accent); font-weight:bold; }
  .chainAddGrid{ display:flex; flex-direction:column; gap:6px; }
  .chainAddCard{ background:#0f0a1c; border:1px solid var(--line); border-radius:4px; padding:8px 10px;
    cursor:pointer; transition:border-color 0.1s; }
  .chainAddCard:hover{ border-color:var(--accent); }
  .chainAddCard .pName{ font-size:11px; color:var(--text); }
  .chainAddCard .pStats{ font-size:9.5px; color:var(--data); margin-top:3px; }

  #statsReadout{ flex-shrink:0; border-top:1px solid var(--line); padding:12px 16px; background:var(--panel2); }
  #statsReadout .eyebrow{ margin-bottom:8px; }
  .statGrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:11px; }
  .statGrid .k{ color:var(--dim); }
  .statGrid .v{ color:var(--data); text-align:right; letter-spacing:0.5px; }
  #weaponReadout{ margin-top:8px; font-size:10px; color:var(--dim); line-height:1.6; }
  #weaponReadout b{ color:var(--accent-glow); }

  #actionRow{ display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); flex-shrink:0; }
  #saveBtn{ flex:1; background:var(--accent); color:#0a0212; border:none; border-radius:3px; font-family:inherit;
    font-weight:bold; font-size:12px; letter-spacing:1px; padding:11px 0; cursor:pointer; text-transform:uppercase; }
  #saveBtn:hover{ filter:brightness(1.15); }
  #saveBtn:disabled{ opacity:0.35; cursor:default; }
  #deleteBtn{ background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:3px;
    font-family:inherit; font-size:11px; padding:11px 14px; cursor:pointer; }
  #deleteBtn:hover{ background:rgba(255,90,77,0.1); }
  #saveMsg{ font-size:10px; padding:0 16px 10px; min-height:12px; letter-spacing:0.5px; }
  #saveMsg.ok{ color:var(--ok); }
  #saveMsg.err{ color:var(--danger); }
</style>
</head>
<body>

<div id="bgGrid"></div>

<!-- ============================= AUTH ============================= -->
<div id="authScreen">
  <div class="authPanel">
    <div class="eyebrow">Robot Arena</div>
    <h1>Accesso Officina</h1>

    <div class="tabs">
      <button id="tabLogin" class="active">Accedi</button>
      <button id="tabRegister">Registrati</button>

      Server
      <input id="serverUrl" value="">
    </div>

</div>

<!-- ============================= GARAGE ============================= -->
<div id="garageScreen" class="hidden">
  <div id="viewport">
    <div id="topBar">
      <div class="brand">Officina Robot<small>Assembly Bay // Sala del Trono Violetta</small></div>
      <div class="userBox">
        <span id="userLabel"></span>
        <a href="/arena" id="goArenaBtn" style="text-decoration:none; background:transparent; border:1px solid var(--line); color:var(--accent-glow); font-family:inherit; font-size:10px; letter-spacing:1px; padding:6px 10px; border-radius:3px;">Vai in Arena →</a>
        <button id="logoutBtn">Esci</button>
      </div>
    </div>
    <div id="robotStrip"></div>
  </div>

  <div id="sidePanel">
    <div id="nameRow">
      <div class="eyebrow">Nome Robot</div>
      <input id="robotNameInput" maxlength="24" placeholder="Es. Falco Rosso">
    </div>

    <div id="slotTabs">
      <button data-slot="torso" class="active">Busto</button>
      <button data-slot="head">Testa</button>

      <button data-slot="arm_right">Br. Dx</button>
      <button data-slot="leg_left">Ga. Sx</button>
      <button data-slot="leg_right">Ga. Dx</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ROBOT ARENA - Client Officina (garage)
   Parla col server via WebSocket (garage_server.py). Protocollo
   a messaggi JSON, vedi commenti in cima a garage_server.py.
   ============================================================ */

// ---------------------------------------------------------------
// Stato applicativo
// ---------------------------------------------------------------
const state = {
  ws: null,
  account: null,
  catalog: null,          // { pieces:[...], slots:[...] }
  robots: [],              // lista robot salvati dell'account
  currentRobotId: null,    // null = robot nuovo, non ancora salvato
  loadout: {               // loadout in editing
    torso_id: null, head_id: null,
    arm_left: [], arm_right: [], leg_left: [], leg_right: [],
    weapon_ids: [], armor_id: null, core_id: null,
  },
  activeSlotTab: "torso",
  activeChainCategory: "limb_segment",  // sotto-tab attiva nel costruttore arto
};

// Costanti di bilanciamento duplicate da garage.py per l'anteprima
// live delle statistiche PRIMA del salvataggio (il server resta
// comunque l'autorita' finale: ri-valida tutto lato suo).
const WEIGHT_SPEED_FACTOR = 0.02;
const MIN_EFFECTIVE_SPEED = 0.5;
const BASE_MAX_HP = 130;
const BASE_SPEED = 3.0;
const BASE_TURN_RATE = 2.8;
const BASE_WEAPON_SLOTS = 2;

// Slot che sono "catene arto" (braccio/gamba costruiti pezzo su pezzo)
// invece di una singola selezione. Duplicato lato client di garage.py.
const LIMB_SLOTS = ["arm_left", "arm_right", "leg_left", "leg_right"];
const LIMB_CHAIN_CATEGORIES = ["limb_segment", "limb_joint", "limb_actuator", "limb_tendon", "limb_terminal"];
const LIMB_CHAIN_LABELS = {
  limb_segment: "Segmenti", limb_joint: "Giunture", limb_actuator: "Ammortizzatori",
  limb_tendon: "Tendini", limb_terminal: "Terminali",
};
const MIN_CHAIN_LEN = 2, MAX_CHAIN_LEN = 8;
const ARM_TERMINAL_KINDS = ["hand", "claw", "universal"];
const LEG_TERMINAL_KINDS = ["foot", "universal"];

function pieceById(id){
  if(!id || !state.catalog) return null;
  return state.catalog.pieces.find(p => p.id === id) || null;
}

function chainPieces(slot){
  return (state.loadout[slot] || []).map(pieceById).filter(Boolean);
}

// Verifica una catena arto e ritorna { ok, msg } - stessa logica di
// garage.py validate_limb_chain, in versione permissiva per l'editor
// (qui serve solo per il messaggio a video, il server ri-valida tutto).
function checkChain(slot){
  const isLeg = slot.startsWith("leg_");
  const label = isLeg ? "gamba" : "braccio";
  const ids = state.loadout[slot] || [];
  if(ids.length < MIN_CHAIN_LEN) return { ok:false, msg:`Serve almeno 1 pezzo strutturale + 1 terminale per la ${label}.` };
  if(ids.length > MAX_CHAIN_LEN) return { ok:false, msg:`Troppi pezzi (max ${MAX_CHAIN_LEN}) per la ${label}.` };
  const pieces = ids.map(pieceById);
  const last = pieces[pieces.length-1];
  if(!last || last.slot !== "limb_terminal") return { ok:false, msg:`L'ultimo pezzo deve essere un terminale.` };
  const allowedKinds = isLeg ? LEG_TERMINAL_KINDS : ARM_TERMINAL_KINDS;
  if(!allowedKinds.includes(last.visual.kind)) return { ok:false, msg:`'${last.name}' non puo' chiudere una ${label}.` };
  for(let i=0;i<pieces.length-1;i++){
    if(pieces[i].slot === "limb_terminal") return { ok:false, msg:`Solo l'ultimo pezzo puo' essere un terminale.` };
  }
  const structural = pieces.filter(p => ["limb_segment","limb_joint","limb_actuator"].includes(p.slot));
  if(structural.length < 1) return { ok:false, msg:`Serve almeno un segmento/giuntura/ammortizzatore oltre al terminale.` };
  return { ok:true, msg:`OK: ${pieces.length} pezzi, lunghezza ${structural.reduce((s,p)=>s+p.visual.length,0).toFixed(2)}m` };
}

function computeDerivedStats(){
  const torso = pieceById(state.loadout.torso_id);
  const head = pieceById(state.loadout.head_id);
  const weapons = (state.loadout.weapon_ids || []).map(pieceById).filter(Boolean);
  const armor = pieceById(state.loadout.armor_id);
  const core = pieceById(state.loadout.core_id);
  if(!torso || !head) return null;
  if(LIMB_SLOTS.some(slot => !checkChain(slot).ok)) return null;

  // torso/head/braccia/gambe sono per ora solo estetici: le stat di
  // combattimento arrivano quando disegneremo il sistema con calma
  // (vedi nota gemella in garage.py compute_derived_stats).
  const totalWeight = weapons.reduce((s,w) => s + w.stats.weight, 0)
    + (armor ? armor.stats.weight : 0);

  const speed = Math.max(MIN_EFFECTIVE_SPEED, BASE_SPEED - WEIGHT_SPEED_FACTOR * totalWeight);

  return {
    max_hp: BASE_MAX_HP,
    weight: totalWeight,
    speed: Math.round(speed * 1000) / 1000,
    turn_rate: BASE_TURN_RATE,
    damage_reduction: armor ? armor.stats.damage_reduction : 0,
    hp_regen_per_sec: core ? core.stats.hp_regen_per_sec : 0,
    reload_bonus: core ? core.stats.reload_bonus : 0,
    weapons,
    torso, head, armor, core,
  };
}

// ---------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------
function defaultServerUrl(){
  // Stesso servizio serve sia questa pagina che il WebSocket (vedi
  // serve_client in server.py): stessa origine, stessa porta, si passa
  // solo da http(s) a ws(s). Il campo resta comunque modificabile a
  // mano (utile in sviluppo locale con porte diverse) e il valore
  // scelto viene ricordato in localStorage.
  const saved = localStorage.getItem("robotArenaServerUrl");
  if(saved) return saved;
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return `${proto}//${location.host}`;
}
document.getElementById("serverUrl").value = defaultServerUrl();
document.getElementById("serverUrl").addEventListener("change", (e) => {
  localStorage.setItem("robotArenaServerUrl", e.target.value.trim());
});
document.getElementById("serverUrl").value = defaultServerUrl();

function connectAndSend(msg, onReplyOnce){
  if(state.ws && state.ws.readyState === WebSocket.OPEN){
    if(onReplyOnce) state.ws._pending.push(onReplyOnce);
    state.ws.send(JSON.stringify(msg));
    return;
  }
  const url = document.getElementById("serverUrl").value.trim() || defaultServerUrl();
  const ws = new WebSocket(url);
  ws._pending = [];
  ws.onopen = () => {
    if(onReplyOnce) ws._pending.push(onReplyOnce);
    ws.send(JSON.stringify(msg));
  };
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    routeMessage(data);
    const cb = ws._pending.shift();
    if(cb) cb(data);
  };
  ws.onerror = () => showAuthErr("Impossibile raggiungere il server. Controlla l'indirizzo.");
  ws.onclose = () => { if(state.ws === ws) state.ws = null; };
  state.ws = ws;
}

// Messaggi "push" gestiti indipendentemente dal chiamante (nessuno per
// ora, ma teniamo un router centrale per estendibilita' futura).
function routeMessage(data){ /* no-op: risposte gestite via callback puntuali */ }

// ---------------------------------------------------------------
// Schermata AUTH
// ---------------------------------------------------------------
let authMode = "login";

function showAuthErr(msg){ document.getElementById("authErr").textContent = msg || ""; }

document.getElementById("tabLogin").onclick = () => {
  authMode = "login";
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabRegister").classList.remove("active");
  document.getElementById("loginFields").classList.remove("hidden");
  document.getElementById("registerFields").classList.add("hidden");
  document.getElementById("authSubmit").textContent = "Accedi";
  showAuthErr("");
};
document.getElementById("tabRegister").onclick = () => {
  authMode = "register";
  document.getElementById("tabRegister").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
  document.getElementById("registerFields").classList.remove("hidden");
  document.getElementById("loginFields").classList.add("hidden");
  document.getElementById("authSubmit").textContent = "Crea Account";
  showAuthErr("");
};

document.getElementById("authSubmit").onclick = () => {
  showAuthErr("");
  const btn = document.getElementById("authSubmit");
  btn.disabled = true;

  if(authMode === "login"){
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    connectAndSend({type:"login", username, password}, (reply) => {
      btn.disabled = false;
      if(reply.type === "error"){ showAuthErr(reply.message); return; }
      onLoggedIn(reply.account);
    });
  } else {
    const username = document.getElementById("regUsername").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    connectAndSend({type:"register", username, email, password}, (reply) => {
      btn.disabled = false;
      if(reply.type === "error"){ showAuthErr(reply.message); return; }
      // Registrazione ok -> login automatico
      connectAndSend({type:"login", username, password}, (reply2) => {
        if(reply2.type === "error"){ showAuthErr(reply2.message); return; }
        onLoggedIn(reply2.account);
      });
    });
  }
};

document.getElementById("logoutBtn").onclick = () => {
  if(state.ws) state.ws.close();
  state.ws = null; state.account = null; state.robots = [];
  state.currentRobotId = null;
  document.getElementById("garageScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
};

function onLoggedIn(account){
  state.account = account;
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("garageScreen").classList.remove("hidden");
  document.getElementById("userLabel").textContent = account.username;
  connectAndSend({type:"get_catalog"}, (reply) => {
    state.catalog = reply;
    startNewRobot();
    renderPieceList();
    connectAndSend({type:"list_robots"}, (reply2) => {
      state.robots = reply2.robots || [];
      renderRobotStrip();
    });
    initViewportIfNeeded();
  });
}

// ---------------------------------------------------------------
// Robot: nuovo / carica / strip
// ---------------------------------------------------------------
function defaultLoadout(){
  return {
    torso_id:"torso_standard", head_id:"head_visor",
    arm_left: ["seg_med_standard", "joint_hinge_small", "seg_med_thin", "term_hand_round"],
    arm_right: ["seg_med_standard", "joint_hinge_small", "seg_med_thin", "term_hand_round"],
    leg_left: ["seg_long_thin", "joint_hinge_large", "seg_med_standard", "term_foot_flat"],
    leg_right: ["seg_long_thin", "joint_hinge_large", "seg_med_standard", "term_foot_flat"],
    weapon_ids:["weap_mg"], armor_id:null, core_id:null,
  };
}

function startNewRobot(){
  state.currentRobotId = null;
  state.loadout = defaultLoadout();
  document.getElementById("robotNameInput").value = "";
  document.getElementById("deleteBtn").classList.add("hidden");
  refreshAll();
}

function loadRobotIntoEditor(robot){
  state.currentRobotId = robot.id;
  state.loadout = {
    torso_id: robot.torso_id, head_id: robot.head_id,
    arm_left: robot.arm_left.slice(), arm_right: robot.arm_right.slice(),
    leg_left: robot.leg_left.slice(), leg_right: robot.leg_right.slice(),
    weapon_ids: robot.weapon_ids.slice(), armor_id: robot.armor_id, core_id: robot.core_id,
  };
  document.getElementById("robotNameInput").value = robot.name;
  document.getElementById("deleteBtn").classList.remove("hidden");
  refreshAll();
}

function renderRobotStrip(){
  const strip = document.getElementById("robotStrip");
  strip.innerHTML = "";
  state.robots.forEach(r => {
    const chip = document.createElement("button");
    chip.className = "robotChip" + (r.id === state.currentRobotId ? " active" : "");
    chip.textContent = r.name;
    chip.onclick = () => loadRobotIntoEditor(r);
    strip.appendChild(chip);
  });
  const newChip = document.createElement("button");
  newChip.className = "robotChip newChip" + (state.currentRobotId === null ? " active" : "");
  newChip.textContent = "+ Nuovo";
  newChip.onclick = startNewRobot;
  strip.appendChild(newChip);
}

// ---------------------------------------------------------------
// Pannello pezzi
// ---------------------------------------------------------------
document.querySelectorAll("#slotTabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#slotTabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.activeSlotTab = btn.dataset.slot;
    renderPieceList();
  };
});

function statLine(piece){
  const v = piece.visual || {};
  switch(piece.slot){
    case "torso": return `Forma: ${v.shape} · Spalle x${v.shoulder_w} · Bacino x${v.hip_w}`;
    case "head": return `Stile: ${v.style}`;
    case "limb_segment": return `Stile: ${v.style} · Lungh. ${v.length.toFixed(2)}m · Raggio ${v.radius.toFixed(3)}m`;
    case "limb_joint": return `Stile: ${v.style} · Piega ${v.bend_deg}° · Lungh. ${v.length.toFixed(2)}m`;
    case "limb_actuator": return `Pistone · Lungh. ${v.length.toFixed(2)}m · Raggio ${v.radius.toFixed(3)}m · non piega`;
    case "limb_tendon": return `Decorativo · Stile: ${v.style} · non allunga l'arto`;
    case "limb_terminal": return `Tipo: ${v.kind} · Stile: ${v.style} · Lungh. ${v.length.toFixed(2)}m`;
    case "weapon": return `Danno ${piece.stats.damage} · Cadenza ${piece.stats.fire_rate}/s · Gittata ${piece.stats.range} · Peso ${piece.stats.weight}`;
    case "armor": return `Riduzione Danno ${Math.round(piece.stats.damage_reduction*100)}% · Peso ${piece.stats.weight}`;
    case "core": return `Rigen ${piece.stats.hp_regen_per_sec}/s · Ricarica +${Math.round(piece.stats.reload_bonus*100)}%`;
    default: return "";
  }
}

function isSelected(slot, id){
  if(slot === "weapon") return state.loadout.weapon_ids.includes(id);
  return state.loadout[slot + "_id"] === id;
}

function togglePiece(slot, id){
  if(slot === "weapon"){
    const list = state.loadout.weapon_ids;
    const idx = list.indexOf(id);
    if(idx >= 0){
      list.splice(idx, 1);
    } else {
      if(list.length >= BASE_WEAPON_SLOTS){
        setSaveMsg(`Slot armi pieni (max ${BASE_WEAPON_SLOTS} per ora).`, "err");
        return;
      }
      list.push(id);
    }
  } else if(slot === "armor" || slot === "core"){
    // opzionali: click su un pezzo gia' selezionato lo rimuove
    state.loadout[slot + "_id"] = (state.loadout[slot + "_id"] === id) ? null : id;
  } else {
    // torso / head: sempre uno selezionato, si sostituisce
    state.loadout[slot + "_id"] = id;
  }
  refreshAll();
}

// ---- gestione catene arto (braccia/gambe) ----
function chainAppend(limbSlot, pieceId){
  const chain = state.loadout[limbSlot];
  if(chain.length >= MAX_CHAIN_LEN){
    setSaveMsg(`Catena piena (max ${MAX_CHAIN_LEN} pezzi).`, "err");
    return;
  }
  chain.push(pieceId);
  refreshAll();
}
function chainRemove(limbSlot, index){
  state.loadout[limbSlot].splice(index, 1);
  refreshAll();
}
function chainMove(limbSlot, index, dir){
  const chain = state.loadout[limbSlot];
  const j = index + dir;
  if(j < 0 || j >= chain.length) return;
  [chain[index], chain[j]] = [chain[j], chain[index]];
  refreshAll();
}
function chainCopyToOtherSide(limbSlot){
  // Comodo per simmetria: copia la catena sx->dx (o dx->sx) con un click,
  // restando comunque libero di poi modificarle in modo indipendente.
  const isLeg = limbSlot.startsWith("leg_");
  const mirror = limbSlot.endsWith("_left")
    ? (isLeg ? "leg_right" : "arm_right")
    : (isLeg ? "leg_left" : "arm_left");
  state.loadout[mirror] = state.loadout[limbSlot].slice();
  refreshAll();
}

function renderPieceList(){
  const container = document.getElementById("pieceList");
  container.innerHTML = "";
  if(!state.catalog) return;
  const slot = state.activeSlotTab;

  if(LIMB_SLOTS.includes(slot)){
    renderChainBuilder(container, slot);
    return;
  }

  const pieces = state.catalog.pieces.filter(p => p.slot === slot);

  if(slot === "weapon"){
    const hint = document.createElement("div");
    hint.className = "slotHint";
    hint.textContent = `Slot arma disponibili: ${state.loadout.weapon_ids.length} / ${BASE_WEAPON_SLOTS}`;
    container.appendChild(hint);
  }
  if(slot === "armor" || slot === "core"){
    const hint = document.createElement("div");
    hint.className = "slotHint";
    hint.textContent = "Opzionale — clicca di nuovo un pezzo selezionato per rimuoverlo.";
    container.appendChild(hint);
  }

  pieces.forEach(p => {
    const card = document.createElement("div");
    const selected = isSelected(slot, p.id);
    card.className = "pieceCard" + (selected ? " selected" : "");
    card.innerHTML = `
      <div class="pName"><span>${p.name}</span>${selected ? '<span class="check">&#10003;</span>' : ""}</div>
      <div class="pStats">${statLine(p)}</div>
      <div class="pCost">Costo: ${p.cost}</div>
    `;
    card.onclick = () => togglePiece(slot, p.id);
    container.appendChild(card);
  });
}

function renderChainBuilder(container, limbSlot){
  const isLeg = limbSlot.startsWith("leg_");
  const label = limbSlot === "arm_left" ? "Braccio Sinistro" : limbSlot === "arm_right" ? "Braccio Destro"
    : limbSlot === "leg_left" ? "Gamba Sinistra" : "Gamba Destra";

  const hint = document.createElement("div");
  hint.className = "slotHint";
  hint.textContent = `${label} — costruisci la catena dall'attacco al ${isLeg ? "bacino" : "busto"} fino al terminale. Clicca un pezzo qui sotto per aggiungerlo in fondo.`;
  container.appendChild(hint);

  const check = checkChain(limbSlot);
  const msg = document.createElement("div");
  msg.className = "chainMsg " + (check.ok ? "ok" : "err");
  msg.textContent = check.msg;
  container.appendChild(msg);

  const mirrorBtn = document.createElement("div");
  mirrorBtn.className = "slotHint";
  const mirrorLabel = limbSlot.endsWith("_left") ? "destro" : "sinistro";
  mirrorBtn.innerHTML = `<span style="text-decoration:underline; cursor:pointer;" id="mirrorLink">Copia questa catena sul lato ${mirrorLabel} &#8594;</span>`;
  container.appendChild(mirrorBtn);
  container.querySelector("#mirrorLink").onclick = () => chainCopyToOtherSide(limbSlot);

  // --- catena attuale, come lista ordinata con rimuovi/sposta ---
  const list = document.createElement("div");
  list.className = "chainList";
  const ids = state.loadout[limbSlot];
  if(ids.length === 0){
    list.innerHTML = `<div class="chainEmpty">Catena vuota — aggiungi il primo pezzo qui sotto.</div>`;
  } else {
    ids.forEach((pid, i) => {
      const p = pieceById(pid);
      const row = document.createElement("div");
      row.className = "chainStep";
      row.innerHTML = `
        <span class="stepIdx">${i+1}.</span>
        <span class="stepName">${p ? p.name : "?"}${p && p.slot === "limb_terminal" ? " (terminale)" : ""}</span>
        <span class="stepBtns">
          <button class="up" title="Sposta su" ${i===0?"disabled":""}>&#8593;</button>
          <button class="dn" title="Sposta giu'" ${i===ids.length-1?"disabled":""}>&#8595;</button>
          <button class="rm" title="Rimuovi">&#10005;</button>
        </span>
      `;
      row.querySelector(".up").onclick = () => chainMove(limbSlot, i, -1);
      row.querySelector(".dn").onclick = () => chainMove(limbSlot, i, 1);
      row.querySelector(".rm").onclick = () => chainRemove(limbSlot, i);
      list.appendChild(row);
    });
  }
  container.appendChild(list);

  // --- sotto-tab per categoria + griglia pezzi aggiungibili ---
  const catTabs = document.createElement("div");
  catTabs.className = "chainCatTabs";
  LIMB_CHAIN_CATEGORIES.forEach(cat => {
    const b = document.createElement("button");
    b.textContent = LIMB_CHAIN_LABELS[cat];
    if(cat === state.activeChainCategory) b.classList.add("active");
    b.onclick = () => { state.activeChainCategory = cat; renderPieceList(); };
    catTabs.appendChild(b);
  });
  container.appendChild(catTabs);

  const addGrid = document.createElement("div");
  addGrid.className = "chainAddGrid";
  let addPieces = state.catalog.pieces.filter(p => p.slot === state.activeChainCategory);
  if(state.activeChainCategory === "limb_terminal"){
    const allowedKinds = isLeg ? LEG_TERMINAL_KINDS : ARM_TERMINAL_KINDS;
    addPieces = addPieces.filter(p => allowedKinds.includes(p.visual.kind));
  }
  addPieces.forEach(p => {
    const card = document.createElement("div");
    card.className = "chainAddCard";
    card.innerHTML = `<div class="pName">+ ${p.name}</div><div class="pStats">${statLine(p)}</div>`;
    card.onclick = () => chainAppend(limbSlot, p.id);
    addGrid.appendChild(card);
  });
  if(addPieces.length === 0){
    addGrid.innerHTML = `<div class="chainEmpty">Nessun pezzo compatibile in questa categoria.</div>`;
  }
  container.appendChild(addGrid);
}

function setSaveMsg(text, cls){

  el.textContent = text || "";
  el.className = cls || "";
}

document.getElementById("saveBtn").onclick = () => {
  const name = document.getElementById("robotNameInput").value.trim();
  if(!name){ setSaveMsg("Dai un nome al robot prima di salvare.", "err"); return; }
  setSaveMsg("Salvataggio...", "");
  connectAndSend({
    type:"save_robot", robot_id: state.currentRobotId, name, loadout: state.loadout,
  }, (reply) => {
    if(reply.type === "error"){ setSaveMsg(reply.message, "err"); return; }
    setSaveMsg("Robot salvato.", "ok");
    state.currentRobotId = reply.robot.id;
    document.getElementById("deleteBtn").classList.remove("hidden");
    connectAndSend({type:"list_robots"}, (r2) => {
      state.robots = r2.robots || [];

document.getElementById("deleteBtn").onclick = () => {
  if(state.currentRobotId === null) return;
  connectAndSend({type:"delete_robot", robot_id: state.currentRobotId}, (reply) => {
    if(reply.type === "error"){ setSaveMsg(reply.message, "err"); return; }
    setSaveMsg("Robot eliminato.", "ok");
    connectAndSend({type:"list_robots"}, (r2) => {
      state.robots = r2.robots || [];
      renderRobotStrip();
      startNewRobot();
    });
  });
};

// =================================================================
// VIEWPORT 3D — vetrina olografica del robot
// =================================================================
let three = null;

function initViewportIfNeeded(){
  if(three) { updateRobotModel(); return; }

  const container = document.getElementById("viewport");
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05030a, 0.035);

  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(3.4, 2.4, 4.4);
  camera.lookAt(0, 1.0, 0);

  // Luci: base viola fredda + key light per far leggere le forme
  scene.add(new THREE.AmbientLight(0x4a2a7a, 0.9));
  const key = new THREE.DirectionalLight(0xe3c6ff, 1.0);
  key.position.set(4, 6, 3);
  scene.add(key);
  const rim = new THREE.PointLight(0xa24bff, 1.4, 12);
  rim.position.set(-3, 2, -3);
  scene.add(rim);

  // Pavimento blueprint: griglia viola su disco scuro semi-trasparente
  const floorGrid = new THREE.GridHelper(6, 24, 0xa24bff, 0x3a1a5a);
  floorGrid.position.y = 0;
  floorGrid.material.transparent = true;
  floorGrid.material.opacity = 0.5;
  scene.add(floorGrid);
  const floorDisc = new THREE.Mesh(
    new THREE.CircleGeometry(3, 48),
    new THREE.MeshBasicMaterial({ color:0x0a0518, transparent:true, opacity:0.55 })
  );
  floorDisc.rotation.x = -Math.PI/2;
  floorDisc.position.y = -0.01;
  scene.add(floorDisc);

  // Anello di scansione olografica che sale e scende (segnale "vetrina attiva")
  const scanRing = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 0.94, 48),
    new THREE.MeshBasicMaterial({ color:0xa24bff, transparent:true, opacity:0.35, side:THREE.DoubleSide })
  );
  scanRing.rotation.x = -Math.PI/2;
  scene.add(scanRing);

  const robotGroup = new THREE.Group();
  scene.add(robotGroup);

  // Rotazione con drag del mouse/touch, altrimenti auto-rotate lento
  let dragging = false, lastX = 0, userYaw = 0, autoYaw = 0;
  const dom = renderer.domElement;
  dom.style.cursor = "grab";
  dom.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; dom.style.cursor = "grabbing"; });
  window.addEventListener("pointerup", () => { dragging = false; dom.style.cursor = "grab"; });
  window.addEventListener("pointermove", (e) => {
    if(!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    userYaw += dx * 0.008;
  });

  function onResize(){
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", onResize);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if(!dragging) autoYaw += 0.0025;
    robotGroup.rotation.y = autoYaw + userYaw;
    scanRing.position.y = 0.15 + (Math.sin(t*0.7)*0.5+0.5) * 1.5;
    scanRing.material.opacity = 0.15 + (Math.sin(t*0.7)*0.5+0.5) * 0.25;
    renderer.render(scene, camera);
  }
  animate();

  three = { renderer, scene, camera, robotGroup, container };
  updateRobotModel();
}

// ----- costruzione procedurale del robot dai pezzi equipaggiati -----

function matSolid(hex, emissive, intensity){
  return new THREE.MeshStandardMaterial({
    color: hex, emissive: emissive || 0x000000, emissiveIntensity: intensity || 0,
    metalness:0.55, roughness:0.35,
  });
}

function addEdgeGlow(mesh, color){
  const edges = new THREE.EdgesGeometry(mesh.geometry);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color || 0xe3c6ff, transparent:true, opacity:0.5 }));
  mesh.add(line);
}

// Orienta e posiziona una mesh gia' creata (altezza unitaria lungo Y
// locale, cioe' da -0.5 a +0.5) tra due punti 3D qualunque, poi la
// "allunga" con scale.y. Usata per costruire liberamente la catena di
// un arto: ogni pezzo puo' puntare in qualunque direzione senza dover
// fare i conti a mano con le rotazioni. Ritorna la lunghezza (a,b).
function orientBetween(mesh, a, b){
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = Math.max(0.001, dir.length());
  const dirNorm = dir.clone().normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const axis = new THREE.Vector3().crossVectors(up, dirNorm);
  const angle = Math.acos(THREE.MathUtils.clamp(up.dot(dirNorm), -1, 1));
  if(axis.lengthSq() > 1e-8) mesh.quaternion.setFromAxisAngle(axis.normalize(), angle);
  return len;
}

// Ruota una mesh (asse locale Y di default) per allinearla a una
// direzione qualsiasi, senza toccarne la posizione: usata per pezzi di
// lunghezza fissa (flange, clip, staffe) che vanno solo orientati.
function alignToDir(mesh, dir){
  const d = dir.clone().normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const axis = new THREE.Vector3().crossVectors(up, d);
  const angle = Math.acos(THREE.MathUtils.clamp(up.dot(d), -1, 1));
  if(axis.lengthSq() > 1e-8) mesh.quaternion.setFromAxisAngle(axis.normalize(), angle);
}

// Come sopra ma per un anello (Torus, asse normale locale Z): usato per
// far "abbracciare" un collare/socket a un tubo o a una sfera.
function alignRingToDir(mesh, dir){
  const d = dir.clone().normalize();
  const zAxis = new THREE.Vector3(0, 0, 1);
  const axis = new THREE.Vector3().crossVectors(zAxis, d);
  const angle = Math.acos(THREE.MathUtils.clamp(zAxis.dot(d), -1, 1));
  if(axis.lengthSq() > 1e-8) mesh.quaternion.setFromAxisAngle(axis.normalize(), angle);
}

function vec3(arr){ return new THREE.Vector3(arr[0], arr[1], arr[2]); }

// Anello di rinforzo ("collare") dove un pezzo si aggancia al successivo:
// il dettaglio che fa leggere una giuntura come vera meccanica assemblata
// invece che un tubo che semplicemente finisce nel vuoto.
function addCollar(group, point, dir, radius, mat){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.max(0.012, radius*1.1), Math.max(0.006, radius*0.22), 6, 12), mat);
  ring.position.set(point[0], point[1], point[2]);
  alignRingToDir(ring, dir);
  group.add(ring);
}

// Molla elicoidale tra due punti: il dettaglio che fa leggere un
// ammortizzatore come tale invece che due tubi telescopici anonimi.
function buildCoilSpring(av, bv, radius, turns, mat){
  const len = av.distanceTo(bv);
  if(len < 0.02) return null;
  const dir = bv.clone().sub(av).normalize();
  const segs = Math.max(20, turns*10);
  const pts = [];
  for(let i = 0; i <= segs; i++){
    const t = i/segs;
    const ang = t*turns*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(ang)*radius, (t-0.5)*len, Math.sin(ang)*radius));
  }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), segs, Math.max(0.004, radius*0.14), 6, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(av.clone().lerp(bv, 0.5));
  alignToDir(mesh, dir);
  return mesh;
}

// Asta "lavorata": leggero rastremo + strizione centrale (come un vero
// pezzo tornito), non un semplice cilindro dritto. Costruita gia' con
// altezza unitaria lungo Y locale (-0.5..+0.5) per poter usare lo stesso
// trucco di scala di orientBetween.
function buildTurnedRod(rNear, rFar, mat){
  const mid = (rNear + rFar)/2 * 0.9;
  const points = [
    new THREE.Vector2(Math.max(0.003, rNear*0.88), -0.5),
    new THREE.Vector2(rNear, -0.44),
    new THREE.Vector2(mid, 0),
    new THREE.Vector2(rFar, 0.44),
    new THREE.Vector2(Math.max(0.003, rFar*0.88), 0.5),
  ];
  return new THREE.Mesh(new THREE.LatheGeometry(points, 10), mat);
}

// ----- pezzi della catena arto: ognuno sa disegnarsi tra due punti -----
function addSegment(group, p, a, b){
  const v = p.visual;
  const av = vec3(a), bv = vec3(b);
  const dir = bv.clone().sub(av).normalize();
  const mat = matSolid(0x1a1030, 0x4bd6ff, 0.15);
  const collarMat = matSolid(0x241633, 0xffb35c, 0.35);
  let mesh;
  let rFar = v.radius;

  if(v.style === "armored"){
    // prisma esagonale con spigolo in alto: legge subito come piastra
    // corazzata, non come un semplice cubo
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(v.radius, v.radius, 1, 6), matSolid(0x241633, 0xa24bff, 0.2));
    mesh.rotation.z = Math.PI/6;
  } else {
    rFar = (v.style === "tapered") ? v.radius*0.6 : v.radius;
    mesh = buildTurnedRod(v.radius, rFar, mat);
  }
  const len = orientBetween(mesh, a, b);
  mesh.scale.y = len;
  addEdgeGlow(mesh, 0x4bd6ff);
  group.add(mesh);

  // collari alle due estremita', dove il pezzo si aggancia alla catena
  addCollar(group, a, dir, v.radius, collarMat);
  addCollar(group, b, dir, rFar, collarMat);
}

function addJoint(group, p, a, b){
  const v = p.visual;
  const av = vec3(a), bv = vec3(b);
  const mid = av.clone().lerp(bv, 0.5);
  const dir = bv.clone().sub(av).normalize();

  if(v.style === "ball"){
    // snodo sferico vero: sfera + anello "socket" che la abbraccia
    const ball = new THREE.Mesh(new THREE.SphereGeometry(v.radius, 16, 12), matSolid(0x241633, 0xffb35c, 0.4));
    ball.position.copy(mid);
    group.add(ball);
    const socket = new THREE.Mesh(new THREE.TorusGeometry(v.radius*0.94, v.radius*0.3, 8, 16), matSolid(0x1a1030, 0xffb35c, 0.25));
    socket.position.copy(mid);
    alignRingToDir(socket, dir);
    group.add(socket);
  } else {
    // cerniera vera: due flange (dischi) affiancate + perno passante
    // visibile, orientato sull'asse su cui l'arto si piega davvero
    const flangeMat = matSolid(0x241633, 0xffb35c, 0.4);
    const flangeLen = Math.max(0.014, v.length*0.4);
    [0.2, 0.8].forEach(t => {
      const flange = new THREE.Mesh(new THREE.CylinderGeometry(v.radius, v.radius, flangeLen, 14), flangeMat);
      flange.position.copy(av.clone().lerp(bv, t));
      alignToDir(flange, dir);
      group.add(flange);
    });
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(v.radius*0.16, v.radius*0.16, v.radius*2.6, 8),
      matSolid(0x0a0518, 0xff5a4d, 0.5));
    pin.position.copy(mid);
    pin.rotation.z = Math.PI/2; // il piegamento avviene sempre attorno all'asse X globale
    group.add(pin);
  }
}

function addActuator(group, p, a, b){
  const v = p.visual;
  const av = vec3(a), bv = vec3(b);
  const mid = av.clone().lerp(bv, 0.55);
  const dir = bv.clone().sub(av).normalize();

  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(v.radius, v.radius*0.96, 1, 12), matSolid(0x1a1030, 0x4bd6ff, 0.15));
  sleeve.scale.y = orientBetween(sleeve, av.toArray(), mid.toArray());
  addEdgeGlow(sleeve, 0x4bd6ff);
  group.add(sleeve);

  const rod = new THREE.Mesh(new THREE.CylinderGeometry(v.radius*0.4, v.radius*0.4, 1, 10), matSolid(0xc9bde0, 0x4bd6ff, 0.1));
  rod.scale.y = orientBetween(rod, mid.toArray(), bv.toArray());
  group.add(rod);

  // molla elicoidale intorno all'asta: il dettaglio che lo fa leggere
  // davvero come un ammortizzatore
  const coil = buildCoilSpring(mid, bv, v.radius*0.7, 5, matSolid(0x2a1a4a, 0xffb35c, 0.3));
  if(coil) group.add(coil);

  // staffe di aggancio (clevis) alle due estremita'
  const bracketMat = matSolid(0x241633, 0xffb35c, 0.3);
  [av, bv].forEach(pt => {
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(v.radius*1.7, v.radius*0.42, v.radius*0.42), bracketMat);
    bracket.position.copy(pt);
    alignToDir(bracket, dir);
    group.add(bracket);
  });
}

function addTendon(group, p, spanA, spanB, side){
  if(!spanA || !spanB) return;
  const v = p.visual;
  const av = vec3(spanA), bv = vec3(spanB);
  const perp = new THREE.Vector3(side < 0 ? -1 : 1, 0, 0);
  const mat = matSolid(0x2a1a4a, 0xff5a4d, 0.3);
  const clipMat = matSolid(0x1a1030, 0xff5a4d, 0.35);
  const sag = Math.max(0.01, av.distanceTo(bv) * 0.1);

  function oneCable(offsetAmt, radius){
    const a2 = av.clone().addScaledVector(perp, offsetAmt);
    const b2 = bv.clone().addScaledVector(perp, offsetAmt);
    // leggero cedimento a meta' cavo: sembra un vero cavo lasco, non
    // un'asta rigida tirata tra due punti
    const mid2 = a2.clone().lerp(b2, 0.5).addScaledVector(perp, sag*0.5).addScaledVector(new THREE.Vector3(0,-1,0), sag*0.4);
    const curve = new THREE.CatmullRomCurve3([a2, mid2, b2]);
    const geo = new THREE.TubeGeometry(curve, 10, Math.max(0.004, radius), 6, false);
    group.add(new THREE.Mesh(geo, mat));
    [a2, b2].forEach(pt => {
      const clip = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.008, radius*1.7), 6, 5), clipMat);
      clip.position.copy(pt);
      group.add(clip);
    });
  }

  if(v.style === "twin"){
    oneCable(0.03, v.radius);
    oneCable(0.055, v.radius*0.9);
  } else {
    oneCable(v.style === "braided" ? 0.045 : 0.035, v.style === "braided" ? v.radius*1.3 : v.radius);
  }
}

function addTerminal(group, p, a, b){
  const v = p.visual;
  const bv = vec3(b);
  const s = v.radius;
  const jointMat = matSolid(0x241633, 0xffb35c, 0.35);
  const skinMat = matSolid(0x241633, 0x4bd6ff, 0.2);
  const darkMat = matSolid(0x1a1030, 0x4bd6ff, 0.15);

  // piccola sfera di snodo (polso/caviglia) dove il terminale si
  // aggancia all'ultimo pezzo della catena
  const wristBall = new THREE.Mesh(new THREE.SphereGeometry(s*0.4, 10, 8), jointMat);
  wristBall.position.copy(bv);
  group.add(wristBall);

  function fingerAt(x, z, len, rot){
    const f = new THREE.Group();
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(s*0.13, s*0.1, len, 6), darkMat);
    seg.position.y = -len/2;
    f.add(seg);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(s*0.1, 6, 5), darkMat);
    tip.position.y = -len;
    f.add(tip);
    f.position.set(bv.x + x, bv.y - s*0.75, bv.z + z);
    f.rotation.x = rot;
    group.add(f);
  }

  if(v.style === "round_hand"){
    const palm = new THREE.Mesh(new THREE.SphereGeometry(s*0.58, 12, 9), skinMat);
    palm.position.set(bv.x, bv.y - s*0.35, bv.z);
    group.add(palm);
    fingerAt(-s*0.3, s*0.1, s*0.42, -0.35);
    fingerAt(0, s*0.15, s*0.48, -0.25);
    fingerAt(s*0.3, s*0.1, s*0.42, -0.35);
  } else if(v.style === "grip_hand"){
    const palm = new THREE.Mesh(new THREE.BoxGeometry(s*0.95, s*0.55, s*0.7), skinMat);
    palm.position.set(bv.x, bv.y - s*0.4, bv.z);
    group.add(palm);
    [-1, 0, 1].forEach(i => fingerAt(i*s*0.32, s*0.25, s*0.5, -0.55));
    const thumb = new THREE.Mesh(new THREE.CylinderGeometry(s*0.13, s*0.1, s*0.35, 6), darkMat);
    thumb.position.set(bv.x + s*0.5, bv.y - s*0.35, bv.z);
    thumb.rotation.z = -0.9;
    group.add(thumb);
  } else if(v.style === "pincer"){
    const base = new THREE.Mesh(new THREE.CylinderGeometry(s*0.32, s*0.4, s*0.3, 10), jointMat);
    base.position.set(bv.x, bv.y - s*0.15, bv.z);
    group.add(base);
    const bladeMat = matSolid(0x3a1a1a, 0xff5a4d, 0.3);
    [-1, 1].forEach(o => {
      const blade = new THREE.Mesh(new THREE.ConeGeometry(s*0.26, s*1.15, 4), bladeMat);
      blade.rotation.x = Math.PI;
      blade.rotation.z = o*0.32;
      blade.position.set(bv.x + o*s*0.22, bv.y - s*0.65, bv.z);
      group.add(blade);
    });
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(s*0.06, s*0.06, s*0.5, 6), matSolid(0x0a0518, 0xff5a4d, 0.5));
    pin.position.set(bv.x, bv.y - s*0.35, bv.z);
    pin.rotation.x = Math.PI/2;
    group.add(pin);
  } else if(v.style === "flat_foot"){
    const sole = new THREE.Mesh(new THREE.BoxGeometry(s*1.3, s*0.28, s*1.85), darkMat);
    sole.position.set(bv.x, bv.y - s*0.28, bv.z + s*0.45);
    addEdgeGlow(sole, 0x4bd6ff);
    group.add(sole);
    const heel = new THREE.Mesh(new THREE.BoxGeometry(s*1.15, s*0.3, s*0.5), skinMat);
    heel.position.set(bv.x, bv.y - s*0.28, bv.z - s*0.35);
    group.add(heel);
  } else if(v.style === "pad_foot"){
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(s*0.88, s*0.7, s*0.4, 16), darkMat);
    pad.position.set(bv.x, bv.y - s*0.3, bv.z + s*0.15);
    addEdgeGlow(pad, 0x4bd6ff);
    group.add(pad);
    const heel = new THREE.Mesh(new THREE.SphereGeometry(s*0.5, 10, 8), skinMat);
    heel.position.set(bv.x, bv.y - s*0.25, bv.z - s*0.35);
    group.add(heel);
  } else if(v.style === "talon"){
    const heel = new THREE.Mesh(new THREE.SphereGeometry(s*0.4, 8, 6), skinMat);
    heel.position.set(bv.x, bv.y - s*0.2, bv.z - s*0.1);
    group.add(heel);
    const clawMat = matSolid(0x1a1030, 0xff5a4d, 0.3);
    for(let i = -1; i <= 1; i++){
      const toeBase = new THREE.Mesh(new THREE.CylinderGeometry(s*0.13, s*0.16, s*0.5, 6), skinMat);
      toeBase.position.set(bv.x + i*s*0.38, bv.y - s*0.32, bv.z + s*0.28);
      toeBase.rotation.x = Math.PI/2 * 0.55;
      group.add(toeBase);
      const claw = new THREE.Mesh(new THREE.ConeGeometry(s*0.16, s*0.55, 5), clawMat);
      claw.position.set(bv.x + i*s*0.38, bv.y - s*0.5, bv.z + s*0.62);
      claw.rotation.x = Math.PI/2 * 0.75;
      group.add(claw);
    }
  } else { // stub (universale): piastra di aggancio con bulloni a vista
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(s*0.7, s*0.78, s*0.5, 12), darkMat);
    cap.position.copy(bv);
    addEdgeGlow(cap, 0x4bd6ff);
    group.add(cap);
    const boltMat = matSolid(0x0a0518, 0xffb35c, 0.4);
    for(let i = 0; i < 5; i++){
      const ang = (i/5) * Math.PI*2;
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(s*0.06, s*0.06, s*0.1, 6), boltMat);
      bolt.position.set(bv.x + Math.cos(ang)*s*0.5, bv.y - s*0.28, bv.z + Math.sin(ang)*s*0.5);
      group.add(bolt);
    }
  }
}

// ----- assembla un'intera catena arto (braccio o gamba) partendo da un
// punto di aggancio (spalla/anca), avanzando lungo la catena pezzo su
// pezzo. Le giunture piegano in avanti la direzione di crescita da quel
// punto in poi; gli ammortizzatori/segmenti no. I tendini sono
// decorativi e si agganciano al pezzo strutturale appena precedente
// senza allungare l'arto. Ritorna il gruppo 3D e il punto finale
// raggiunto (serve per far toccare terra le gambe qualunque sia la
// combinazione scelta). -----
function buildLimbChain(pieces, origin, side){
  const group = new THREE.Group();
  const cursor = new THREE.Vector3(origin[0], origin[1], origin[2]);
  const dir = new THREE.Vector3(0, -1, 0);
  let lastSpan = null;

  pieces.forEach(p => {
    const v = p.visual;
    if(p.slot === "limb_tendon"){
      if(lastSpan) addTendon(group, p, lastSpan[0], lastSpan[1], side);
      return;
    }
    const start = cursor.clone();
    const end = start.clone().addScaledVector(dir, v.length);

    if(p.slot === "limb_terminal"){
      addTerminal(group, p, start.toArray(), end.toArray());
    } else if(p.slot === "limb_joint"){
      addJoint(group, p, start.toArray(), end.toArray());
      dir.applyAxisAngle(new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(v.bend_deg));
    } else if(p.slot === "limb_actuator"){
      addActuator(group, p, start.toArray(), end.toArray());
    } else {
      addSegment(group, p, start.toArray(), end.toArray());
    }
    lastSpan = [start.toArray(), end.toArray()];
    cursor.copy(end);
  });

  return { group, endPoint: cursor.toArray() };
}

// ----- BUSTO: forma la scocca centrale e restituisce i punti di
// aggancio (spalle/anche/collo) per il resto del corpo -----
function buildTorsoPart(torso){
  const v = torso.visual;
  const [w, h, d] = v.dims;
  const group = new THREE.Group();
  const mat = matSolid(v.color || 0x2a1a4a, 0xa24bff, 0.25);

  if(v.shape === "barrel"){
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(w/2, w/2*0.92, h, 14), mat);
    addEdgeGlow(mesh, 0xa24bff);
    group.add(mesh);
  } else if(v.shape === "wide"){
    const upper = new THREE.Mesh(new THREE.BoxGeometry(w*v.shoulder_w, h*0.5, d), mat);
    upper.position.y = h*0.22;
    addEdgeGlow(upper, 0xa24bff);
    group.add(upper);
    const lower = new THREE.Mesh(new THREE.BoxGeometry(w*v.hip_w*1.15, h*0.54, d*0.85), mat);
    lower.position.y = -h*0.26;
    addEdgeGlow(lower, 0xa24bff);
    group.add(lower);
  } else {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    addEdgeGlow(mesh, 0xa24bff);
    group.add(mesh);
  }

  // piastra pettorale leggermente sporgente + prese d'aria laterali:
  // il dettaglio che fa leggere il busto come una scocca costruita a
  // pannelli, non un solido unico
  const plate = new THREE.Mesh(new THREE.BoxGeometry(w*0.48, h*0.4, d*0.1), matSolid(0x1a1030, 0xa24bff, 0.3));
  plate.position.set(0, h*0.04, d/2 + d*0.045);
  addEdgeGlow(plate, 0xa24bff);
  group.add(plate);
  const ventMat = matSolid(0x0a0518, 0x4bd6ff, 0.2);
  [-1, 1].forEach(side => {
    const vent = new THREE.Mesh(new THREE.BoxGeometry(w*0.05, h*0.28, d*0.65), ventMat);
    vent.position.set(side*w*0.36, -h*0.06, 0);
    group.add(vent);
  });

  const shoulderY = h*0.42, hipY = -h*0.46;
  const shW = (w * v.shoulder_w) / 2, hpW = (w * v.hip_w) / 2;
  const anchors = {
    shoulderL: [-shW, shoulderY, 0], shoulderR: [shW, shoulderY, 0],
    hipL: [-hpW, hipY, 0], hipR: [hpW, hipY, 0],
    neck: [0, h/2, 0],
  };

  // spallacci (pauldron) alle attaccature delle braccia: raccordano
  // visivamente il busto al collare del primo pezzo del braccio
  const pauldronMat = matSolid(0x241633, 0xffb35c, 0.3);
  [anchors.shoulderL, anchors.shoulderR].forEach(pt => {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(w*0.1, 10, 8), pauldronMat);
    cap.position.set(pt[0], pt[1], pt[2]);
    group.add(cap);
  });

  return { group, anchors, height: h };
}

// ----- TESTA -----
function buildHeadPart(head){
  const v = head.visual;
  const s = v.size;
  const group = new THREE.Group();
  const mat = matSolid(0x241633, 0xa24bff, 0.25);

  if(v.style === "round"){
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), mat);
    addEdgeGlow(m, 0xa24bff);
    group.add(m);
  } else if(v.style === "visor"){
    const m = new THREE.Mesh(new THREE.BoxGeometry(s*1.6, s*1.3, s*1.3), mat);
    addEdgeGlow(m, 0xa24bff);
    group.add(m);
    const visor = new THREE.Mesh(new THREE.BoxGeometry(s*1.5, s*0.28, s*0.12),
      new THREE.MeshStandardMaterial({ color:0x4bd6ff, emissive:0x4bd6ff, emissiveIntensity:1.2 }));
    visor.position.set(0, s*0.08, s*0.66);
    group.add(visor);
    const earMat = matSolid(0x1a1030, 0x4bd6ff, 0.2);
    [-1, 1].forEach(side => {
      const ear = new THREE.Mesh(new THREE.BoxGeometry(s*0.14, s*0.5, s*0.4), earMat);
      ear.position.set(side*s*0.82, 0, 0);
      group.add(ear);
    });
  } else if(v.style === "angular"){
    const base = new THREE.Mesh(new THREE.CylinderGeometry(s*0.75, s*0.75, s*0.3, 6), mat);
    base.position.y = -s*0.6;
    addEdgeGlow(base, 0xa24bff);
    group.add(base);
    const m = new THREE.Mesh(new THREE.ConeGeometry(s*1.05, s*1.7, 4), mat);
    m.rotation.y = Math.PI/4;
    m.position.y = s*0.1;
    addEdgeGlow(m, 0xa24bff);
    group.add(m);
  } else if(v.style === "antenna"){
    const m = new THREE.Mesh(new THREE.BoxGeometry(s*1.3, s*1.1, s*1.1), mat);
    addEdgeGlow(m, 0xa24bff);
    group.add(m);
    const antMat = matSolid(0x1a1030, 0xff5a4d, 0.3);
    const tipMat = new THREE.MeshStandardMaterial({ color:0xff5a4d, emissive:0xff5a4d, emissiveIntensity:1.2 });
    [-1, 1].forEach(side => {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(s*0.05, s*0.06, s*0.1, 8), antMat);
      base.position.set(side*s*0.4, s*0.6, 0);
      group.add(base);
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, s*1.5, 6), antMat);
      ant.position.set(side*s*0.4, s*1.15, 0);
      group.add(ant);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), tipMat);
      tip.position.set(side*s*0.4, s*1.9, 0);
      group.add(tip);
    });
  } else { // cyclops
    const m = new THREE.Mesh(new THREE.BoxGeometry(s*1.4, s*1.3, s*1.3), mat);
    addEdgeGlow(m, 0xa24bff);
    group.add(m);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(s*0.44, s*0.08, 8, 16),
      matSolid(0x1a1030, 0xff5a4d, 0.3));
    ring.position.set(0, 0, s*0.68);
    group.add(ring);
    const eye = new THREE.Mesh(new THREE.CylinderGeometry(s*0.36, s*0.36, 0.06, 20),
      new THREE.MeshStandardMaterial({ color:0xff5a4d, emissive:0xff5a4d, emissiveIntensity:1.3 }));
    eye.rotation.x = Math.PI/2;
    eye.position.set(0, 0, s*0.68);
    group.add(eye);
  }

  // collare alla base, dove la testa si aggancia al collo: la stessa
  // logica dei collari degli arti, per coerenza visiva in tutto il robot
  const collar = new THREE.Mesh(new THREE.TorusGeometry(s*0.5, s*0.1, 6, 14), matSolid(0x1a1030, 0xffb35c, 0.3));
  collar.rotation.x = Math.PI/2;
  collar.position.y = -s*0.85;
  group.add(collar);

  return group;
}

function buildHeadGroup(head, neck){
  const g = buildHeadPart(head);
  g.position.set(neck[0], neck[1] + (head.visual.size || 0.15), neck[2]);
  return g;
}

function buildArmor(armor, torsoDims){
  const [w, h, d] = torsoDims;
  const opacity = armor.id === "armor_heavy" ? 0.28 : 0.16;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w*1.18, h*1.1, d*1.18),
    new THREE.MeshBasicMaterial({ color:0xe3c6ff, transparent:true, opacity, wireframe:false })
  );
  addEdgeGlow(mesh, 0xe3c6ff);
  return mesh;
}

function buildCore(core){
  const color = core.id === "core_overcharge" ? 0xffb35c : 0x7dffa8;
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.09, 0),
    new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.9, metalness:0.2, roughness:0.2 })
  );
  return mesh;
}

// ----- assemblaggio completo del robot umanoide -----
function buildHumanoidGroup(loadout, resolvePiece){
  const torsoPiece = resolvePiece(loadout.torso_id);
  const headPiece = resolvePiece(loadout.head_id);
  if(!torsoPiece || !headPiece) return null;

  const armLeftPieces = (loadout.arm_left || []).map(resolvePiece).filter(Boolean);
  const armRightPieces = (loadout.arm_right || []).map(resolvePiece).filter(Boolean);
  const legLeftPieces = (loadout.leg_left || []).map(resolvePiece).filter(Boolean);
  const legRightPieces = (loadout.leg_right || []).map(resolvePiece).filter(Boolean);

  const rig = new THREE.Group();
  const { group: torsoGroup, anchors } = buildTorsoPart(torsoPiece);
  rig.add(torsoGroup);
  rig.add(buildHeadGroup(headPiece, anchors.neck));

  const armL = buildLimbChain(armLeftPieces, anchors.shoulderL, -1);
  rig.add(armL.group);
  const armR = buildLimbChain(armRightPieces, anchors.shoulderR, 1);
  rig.add(armR.group);
  const legL = buildLimbChain(legLeftPieces, anchors.hipL, -1);
  rig.add(legL.group);
  const legR = buildLimbChain(legRightPieces, anchors.hipR, 1);
  rig.add(legR.group);

  // Il robot deve stare "in piedi" a terra qualunque catena di gambe si
  // costruisca: guardiamo il punto piu' basso raggiunto (endPoint) da
  // ciascuna gamba e alziamo l'intero rig di conseguenza. Se una gamba
  // e' ancora vuota/incompleta (in costruzione nell'editor) il suo
  // endPoint resta all'anca: va bene, il robot "galleggera'" finche' non
  // la completi, e' solo un'anteprima.
  const lowestY = Math.min(legL.endPoint[1], legR.endPoint[1], anchors.hipL[1], anchors.hipR[1]);
  const standHeight = -lowestY + 0.01;

  const weapons = (loadout.weapon_ids || []).map(resolvePiece).filter(Boolean);
  const mounts = WEAPON_MOUNTS[weapons.length] || WEAPON_MOUNTS[2];
  weapons.forEach((w, i) => {
    const wm = buildWeapon(w);
    const pos = mounts[i] || mounts[mounts.length-1];
    wm.position.set(pos[0], anchors.neck[1]*0.55 + pos[1], pos[2]);
    rig.add(wm);
  });

  const armorPiece = resolvePiece(loadout.armor_id);
  if(armorPiece) rig.add(buildArmor(armorPiece, torsoPiece.visual.dims));

  const corePiece = resolvePiece(loadout.core_id);
  if(corePiece){
    const c = buildCore(corePiece);
    c.position.set(0, anchors.neck[1]*0.5, torsoPiece.visual.dims[2]/2 + 0.03);
    rig.add(c);
  }

  const outer = new THREE.Group();
  outer.add(rig);
  outer.position.y = standHeight;
  return outer;
}

function updateRobotModel(){
  if(!three) return;
  const group = three.robotGroup;
  while(group.children.length) group.remove(group.children[0]);

  const humanoid = buildHumanoidGroup(state.loadout, pieceById);
  if(humanoid) group.add(humanoid);
}
